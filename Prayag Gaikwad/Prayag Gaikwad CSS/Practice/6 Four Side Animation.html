<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Four Direction Animation</title>

    <style>
        .box {
            height: 90px;
            width: 90px;
            border: 5px solid black;
            position: fixed;
            animation-duration: 3s;
            animation-iteration-count: infinite;
        }

        /* From Left */
        .left {
            top: 10px;
            left: 10px;
            animation-name: fromLeft;
        }

        @keyframes fromLeft {
            0% {
                left: 10px;
                background: red;
                scale: 1;
            }

            50% {
                left: 40%;
                top: 40%;
                background: blue;
                border-radius: 100%;
                rotate: 360deg;
                scale: 1.5;
            }

            100% {
                left: 10px;
                top: 10px;
                background: orange;
                border-radius: 0;
                scale: 1;
            }
        }

        /* From Right */
        .right {
            top: 10px;
            right: 10px;
            animation-name: fromRight;
        }

        @keyframes fromRight {
            0% {
                right: 10px;
                background: orange;
                scale: 1;
            }

            50% {
                right: 40%;
                top: 40%;
                background: blue;
                border-radius: 100%;
                rotate: -360deg;
                scale: 1.5;
            }

            100% {
                right: 10px;
                top: 10px;
                background: red;
                border-radius: 0;
                scale: 1;
            }
        }

        /* From Top */
        .top {
            top: 10px;
            left: 40%;
            animation-name: fromTop;
        }

        @keyframes fromTop {
            0% {
                top: 10px;
                background: green;
            }

            50% {
                top: 40%;
                left: 45%;
                background: yellow;
                border-radius: 100%;
                rotate: 360deg;
                scale: 1.5;
            }

            100% {
                top: 10px;
                left: 40%;
                background: purple;
                border-radius: 0;
                scale: 1;
            }
        }

        /* From Bottom */
        .bottom {
            bottom: 10px;
            left: 40%;
            animation-name: fromBottom;
        }

        @keyframes fromBottom {
            0% {
                bottom: 10px;
                background: purple;
            }

            50% {
                bottom: 40%;
                left: 45%;
                background: pink;
                border-radius: 100%;
                rotate: -360deg;
                scale: 1.5;
            }

            100% {
                bottom: 10px;
                left: 40%;
                background: green;
                border-radius: 0;
                scale: 1;
            }
        }
    </style>
</head>

<body>
    <div class="box left"></div>
    <div class="box right"></div>
    <div class="box top"></div>
    <div class="box bottom"></div>
</body>

</html>
