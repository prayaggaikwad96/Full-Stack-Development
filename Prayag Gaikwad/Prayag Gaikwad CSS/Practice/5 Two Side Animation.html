<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Two Side Animation</title>

    <style>
        .box {
            height: 90px;
            width: 90px;
            border: 5px solid black;
            position: relative;
            animation-duration: 2s;
            animation-iteration-count: infinite;
        }

        .left-box {
            animation-name: Anm1;
        }

        .right-box {
            animation-name: Anm2;
        }

        @keyframes Anm1 {
            0% {
                scale: 1;
                top: 0;
                left: 10px;
                background-color: red;
            }

            25% {
                left: 600px;
            }

            50% {
                scale: 1.5;
                border-radius: 100%;
                rotate: 360deg;
                background-color: blue;
                top: 100px;
                left: 100px;
            }

            75% {
                left: 500px;
            }

            100% {
                top: 0;
                left: 10px;
                scale: 1;
                border-radius: 0;
                background-color: orange;
            }
        }

        @keyframes Anm2 {
            0% {
                scale: 1;
                top: 0;
                left: 600px;
                background-color: orange;
            }

            25% {
                left: 10px;
            }

            50% {
                scale: 1.5;
                border-radius: 100%;
                rotate: -360deg;
                background-color: blue;
                top: 100px;
                left: 500px;
            }

            75% {
                left: 100px;
            }

            100% {
                top: 0;
                left: 600px;
                scale: 1;
                border-radius: 0;
                background-color: red;
            }
        }
    </style>
</head>

<body>
    <div class="box left-box"></div>
    <br>
    <div class="box right-box"></div>
</body>

</html>
