<!DOCTYPE html>
<html>

<head>
    <!-- 1. External font stylesheet linked correctly in the head -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Trirong">

    <!-- 2. Consolidated CSS rules inside a single style block -->
    <style>
        body {
            background-color: aquamarine;
            font-family: "Trirong", serif;
        }
    </style>
</head>

<body>
    <h1>Trirong Font</h1>
    <p>Lorem ipsum dolor sit amet.</p>
    <p>123456790</p>
</body>

</html>
