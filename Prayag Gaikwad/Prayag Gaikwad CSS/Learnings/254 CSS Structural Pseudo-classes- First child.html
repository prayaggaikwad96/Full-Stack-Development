<!DOCTYPE html>
<html>
<head>
<style>

body{
background-color: lightblue;
text-align: center;
}

p:first-child {
  color: orange;
} 
</style>
</head>
<body>

<h2>Use p:first-child</h2>

<p>Style any p element that is the first child of any element:</p>

<div>
  <p>This is some text.</p>
  <p>This is some text.</p>
  <div>
    <p>This is some text.</p>
    <p>This is some text.</p>
  </div>
</div>

<div>
  <p>This is some text.</p>
  <p>This is some text.</p>
</div>

</body>
</html>
