<!DOCTYPE html>
<html>

<head>
    <style>
        body{
            background-color: rgb(181, 219, 255);
            text-align: center;
        }
        .center {
            margin: auto;
            width: 50%;
            border: 3px solid #1089b5;
            padding: 10px;
        }

        p {
            text-align: center;
        }
    </style>
</head>

<body>

    <h2>Center Align Text in Div</h2>

    <div class="center">
        <p>I am centered!</p>
    </div>

</body>

</html>
