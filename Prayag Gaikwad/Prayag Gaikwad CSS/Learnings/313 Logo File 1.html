<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Media</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: white;
            font-family: Arial, sans-serif;
        }

        /* MAIN BOX */
        .main {
            width: 1020px;
            height: 1070px;
            margin: 15px auto;
            position: relative;
            border: 5px solid rgb(40, 70, 27);
            background: linear-gradient(110deg, #aad0fa, #7cb7e3, #9e98ed);
            overflow: hidden;
        }

        /* COMMON LOGO BOX */
        .logo-box {
            width: 280px;
            height: 280px;
            background-color: white;
            border: 5px solid green;
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
        }

        .logo-box img {
            width: 175px;
            height: 175px;
            object-fit: contain;
        }

        /* WHATSAPP */
        .whatsapp {
            top: 0;
            left: 0;
        }

        .whatsapp img {
            width: 150px;
            height: 150px;
        }

        /* TWITTER */
        .twitter {
            top: 195px;
            left: 180px;
        }

        .twitter img {
            width: 190px;
            height: 190px;
        }

        /* LOCO */
        .loco {
            width: 280px;
            height: 280px;
            position: absolute;
            top: 175px;
            left: 565px;
            background-color: #171238;
            border: 5px solid green;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .loco img {
            width: 190px;
            height: 190px;
            object-fit: contain;
        }

        /* ROOTER */
        .rooter {
            top: 0;
            right: 0;
        }

        /* INSTAGRAM */
        .instagram {
            bottom: 175px;
            left: 180px;
        }

        .instagram img {
            width: 190px;
            height: 190px;
        }

        /* YOUTUBE */
        .youtube {
            bottom: 195px;
            right: 180px;
        }

        .youtube img {
            width: 160px;
            height: 160px;
        }

        /* FACEBOOK */
        .facebook {
            bottom: 0;
            left: 0;
        }

        .facebook img {
            width: 175px;
            height: 175px;
        }

        /* PINTEREST */
        .pinterest {
            bottom: 0;
            right: 0;
        }

        .pinterest img {
            width: 170px;
            height: 170px;
        }

        /* CENTER SOCIAL MEDIA BOX */
        .social {
            width: 280px;
            height: 280px;
            position: absolute;
            top: 390px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #91cf28;
            border: 5px solid green;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: red;
            font-family: "Times New Roman", serif;
            font-size: 48px;
            font-weight: bold;
            line-height: 1.35;
            text-align: center;
        }

        /* RESPONSIVE TABLET */
        @media (max-width: 1040px) {
            .main {
                margin: 15px;
                width: 1020px;
                transform: scale(calc((100vw - 30px) / 1020));
                transform-origin: top left;
            }
        }

        /* SMALL MOBILE */
        @media (max-width: 500px) {
            .main {
                margin: 10px;
                transform: scale(calc((100vw - 20px) / 1020));
                transform-origin: top left;
            }
        }
    </style>
</head>

<body>

    <div class="main">

        <!-- WhatsApp -->
        <div class="logo-box whatsapp">
            <img src="../CSS Images/WhatsApp.svg.webp" alt="WhatsApp">
        </div>

        <!-- Twitter -->
        <div class="logo-box twitter">
            <img src="../CSS Images/Twitter-Logo-2010.png" alt="Twitter">
        </div>

        <!-- Loco -->
        <div class="loco">
            <img src="../CSS Images/0x0.png" alt="Loco">
        </div>

        <!-- Rooter -->
        <div class="logo-box rooter">
            <img src="../CSS Images/Rooter images (1).png" alt="Rooter">
        </div>

        <!-- Instagram -->
        <div class="logo-box instagram">
            <img src="../CSS Images/Instagram_logo_2022.svg.webp" alt="Instagram">
        </div>

        <!-- YouTube -->
        <div class="logo-box youtube">
            <img src="../CSS Images/YouTube_full-color_icon_(2017).svg.webp" alt="YouTube">
        </div>

        <!-- Facebook -->
        <div class="logo-box facebook">
            <img src="../CSS Images/Facebook_f_logo_(2021).svg.webp" alt="Facebook">
        </div>

        <!-- Pinterest -->
        <div class="logo-box pinterest">
            <img src="../CSS Images/Pinterest_logo.png" alt="Pinterest">
        </div>

        <!-- Social Media -->
        <div class="social">
            <div>Social</div>
            <div>Media</div>
        </div>

    </div>

</body>

</html>
