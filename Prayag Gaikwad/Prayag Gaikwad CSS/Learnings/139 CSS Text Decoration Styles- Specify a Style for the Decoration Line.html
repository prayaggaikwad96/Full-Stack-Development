<!DOCTYPE html>
<html>

<head>
    <style>
        /* Reusable decoration classes */
        .ol-orange {
            text-decoration-line: overline;
            text-decoration-color: orange;
            text-decoration-thickness: 3px;
        }

        .ol-purple {
            text-decoration-line: overline;
            text-decoration-color: purple;
            text-decoration-thickness: 3px;
        }

        .ol-green {
            text-decoration-line: overline;
            text-decoration-color: green;
            text-decoration-thickness: 3px;
        }

        .ol-teal {
            text-decoration-line: overline;
            text-decoration-color: teal;
            text-decoration-thickness: 3px;
        }

        .ol-brown {
            text-decoration-line: overline;
            text-decoration-color: brown;
            text-decoration-thickness: 3px;
        }

        .ol-pink {
            text-decoration-line: overline;
            text-decoration-color: pink;
            text-decoration-thickness: 3px;
        }

        .lt-red {
            text-decoration-line: line-through;
            text-decoration-color: red;
            text-decoration-thickness: 2px;
        }

        .lt-blue {
            text-decoration-line: line-through;
            text-decoration-color: blue;
            text-decoration-thickness: 2px;
        }

        .lt-green {
            text-decoration-line: line-through;
            text-decoration-color: green;
            text-decoration-thickness: 2px;
        }

        .lt-orange {
            text-decoration-line: line-through;
            text-decoration-color: orange;
            text-decoration-thickness: 2px;
        }

        .lt-purple {
            text-decoration-line: line-through;
            text-decoration-color: purple;
            text-decoration-thickness: 2px;
        }

        .ul-blue {
            text-decoration-line: underline;
            text-decoration-color: blue;
            text-decoration-thickness: 3px;
        }

        .ul-green {
            text-decoration-line: underline;
            text-decoration-color: green;
            text-decoration-thickness: 3px;
        }

        .ul-purple {
            text-decoration-line: underline;
            text-decoration-color: purple;
            text-decoration-thickness: 3px;
        }

        .ul-red {
            text-decoration-line: underline;
            text-decoration-color: red;
            text-decoration-thickness: 3px;
        }

        .ul-black {
            text-decoration-line: underline;
            text-decoration-color: black;
            text-decoration-thickness: 3px;
        }

        /* Optional styles like dashed/wavy */
        .dashed {
            text-decoration-style: dashed;
        }

        .dotted {
            text-decoration-style: dotted;
        }

        .wavy {
            text-decoration-style: wavy;
        }
    </style>
</head>

<body>

    <h1>
        <span class="ol-orange">
            <span class="lt-red">
                <span class="ul-blue">Heading 1 (Solid)</span>
            </span>
        </span>
    </h1>

    <h2>
        <span class="ol-purple">
            <span class="lt-blue dashed">
                <span class="ul-green">Heading 2 (Dashed through)</span>
            </span>
        </span>
    </h2>

    <h3>
        <span class="ol-green">
            <span class="lt-orange">
                <span class="ul-purple dotted">Heading 3 (Dotted underline)</span>
            </span>
        </span>
    </h3>

    <p class="ex1">
        <span class="ol-teal">
            <span class="lt-green">
                <span class="ul-red dashed">A paragraph (Dashed underline).</span>
            </span>
        </span>
    </p>

    <p class="ex2">
        <span class="ol-brown">
            <span class="lt-purple">
                <span class="ul-black wavy">Another paragraph (Wavy underline).</span>
            </span>
        </span>
    </p>

    <p class="ex3">
        <span class="ol-pink">
            <span class="lt-red">
                <span class="ul-blue wavy">Another paragraph (Red wavy).</span>
            </span>
        </span>
    </p>

</body>

</html>
