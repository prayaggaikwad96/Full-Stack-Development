<!DOCTYPE html>
<html>

<head>
    <style>
        body{
            background-color: bisque;
            text-align: center;
            justify-content: center;
        }
        a:link,
        a:visited {
            background-color: #f44336;
            color: white;
            padding: 14px 25px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
        }

        a:hover,
        a:active {
            background-color: red;
        }
    </style>
</head>

<body>

    <h2>Link Button</h2>

    <p>A link styled as a button:</p>
    <a href="https://youtu.be/vZIXSQlzJKA?si=IxZgDVdaqPtKFofv" target="_blank"> Japan Countryside </a>

</body>

</html>
