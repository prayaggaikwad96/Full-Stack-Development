<!DOCTYPE html>
<html>

<head>
    <style>
        p.one {
            border-style: solid;
            border-color: rgb(237, 153, 153) rgb(161, 244, 161) rgb(130, 130, 249) rgb(252, 252, 139);
            /* red top, green right, blue bottom and yellow left */
        }
    </style>
</head>

<body>

    <h2>The border-color Property</h2>
    <p>The border-color property can have from one to four values (for the top border, right border, bottom border, and
        the left border):</p>

    <p class="one">A solid multicolor border</p>

</body>

</html>
