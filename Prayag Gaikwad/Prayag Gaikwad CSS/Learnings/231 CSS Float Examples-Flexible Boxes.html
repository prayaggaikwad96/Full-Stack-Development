<!DOCTYPE html>
<html>

<head>
    <style>
        body{
            background-color: bisque;
            text-align: center;
        }
        .flex-container {
            display: flex;
            flex-wrap: nowrap;
            background-color: DodgerBlue;
        }

        .flex-container .box {
            background-color: #f1f1f1;
            width: 50%;
            margin: 10px;
            text-align: center;
            line-height: 75px;
            font-size: 30px;
        }
    </style>
</head>

<body>

    <h1>Flexible Boxes</h1>

    <div class="flex-container">
        <div class="box">Box 1 - This is some text to make sure that the content gets really tall. This is some text to
            make sure that the content gets really tall.</div>
        <div class="box">Box 2 - My height will follow Box 1.</div>
    </div>

    <p>Try to resize the browser window to see the flexible layout.</p>

</body>

</html>
