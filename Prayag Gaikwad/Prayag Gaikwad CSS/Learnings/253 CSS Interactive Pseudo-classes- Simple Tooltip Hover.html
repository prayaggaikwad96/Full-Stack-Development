<!DOCTYPE html>
<html>

<head>
    <style>
        body{
            background-color: bisque;
            text-align: center;
        }
        p {
            display: none;
            background-color: rgb(130, 184, 242);
            padding: 20px;
        }

        div:hover p {
            display: block;
        }
    </style>
</head>

<body>

    <h2>Use :hover to Show Tooltip</h2>

    <div>Hover over this div element to show the p element
        <p>Tada! Here I am!</p>
    </div>

</body>

</html>
