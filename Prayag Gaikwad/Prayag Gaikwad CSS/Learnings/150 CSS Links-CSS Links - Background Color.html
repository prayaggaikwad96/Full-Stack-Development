<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avengers Doomsday Trailer</title>
    <style>
        body {
            background-color: rgb(242, 166, 78);
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }

        .video-container {
            margin: 20px auto;
            max-width: 560px;
        }

        iframe {
            width: 100%;
            height: 315px;
            border-radius: 8px;
            border: none;
        }

        a:link {
            background-color: yellow;
            color: black;
            padding: 2px 5px;
        }

        a:visited {
            background-color: cyan;
            color: black;
            padding: 2px 5px;
        }

        a:hover {
            background-color: rgb(155, 210, 155);
            color: black;
            padding: 2px 5px;
        }

        a:active {
            background-color: hotpink;
            color: black;
            padding: 2px 5px;
        }
    </style>
</head>

<body>

    <h1>Avengers Doomsday Trailer</h1>

    <!-- Embedded YouTube Player -->
    <div class="video-container">
        <iframe width="560" height="315" src="https://www.youtube.com/embed/irVNGjRFZGk"
            title="Avengers: Doomsday Trailer"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
            allowfullscreen></iframe>
    </div>

    <p><a href="https://www.youtube.com/watch?v=irVNGjRFZGk" target="_blank">Watch directly on YouTube</a></p>

    <p><b>Note:</b> :hover must come after :link and :visited in order to be effective.</p>
    <p><b>Note:</b> :active must come after :hover in order to be effective.</p>

</body>

</html>
