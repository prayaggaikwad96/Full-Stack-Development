<!DOCTYPE html>
<html>

<head>
    <style>
        ul {
            /* Use a relative path instead of an absolute local D:/ path */
            list-style-image: url('');

            /* Use a valid fallback type like 'disc' or 'square' */
            list-style-type: square;
        }
    </style>
</head>

<body>

    <h2>The list-style-image Property</h2>

    <p>The list-style-image property specifies an image as the list item marker:</p>

    <ul>
        <li>Coffee</li>
        <li>Tea</li>
        <li>Coca Cola</li>
    </ul>

</body>

</html>
