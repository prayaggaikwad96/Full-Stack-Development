<!DOCTYPE html>
<html>

<head>
    <style>
        body{
            background-color: aquamarine;
            text-align: center;
        }
        .container {
            position: relative;
        }

        .black-box {
            position: relative;
            border: 2px solid black;
            height: 100px;
            margin: 30px;
        }

        .gray-box {
            position: absolute;
            background: lightgray;
            height: 60px;
            width: 70%;
            left: 50px;
            top: 50px;
        }

        .green-box {
            position: absolute;
            background: lightgreen;
            width: 35%;
            left: 270px;
            top: -15px;
            height: 100px;
        }
    </style>
</head>

<body>

    <h1>Overlapping elements with no z-index</h1>

    <p>If two positioned elements overlap each other without a z-index specified,
        the elements render in the order they are defined in the HTML source code:</p>

    <div class="container">
        <div class="black-box">Black box</div>
        <div class="gray-box">Gray box</div>
        <div class="green-box">Green box</div>
    </div>

</body>

</html>
