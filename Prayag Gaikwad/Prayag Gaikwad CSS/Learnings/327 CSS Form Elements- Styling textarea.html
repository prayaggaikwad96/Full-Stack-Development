<!DOCTYPE html>
<html>

<head>
    <style>
        body{
            background-color: rgb(196, 234, 242);
            text-align: center;
        }
        textarea {
            width: 100%;
            height: 150px;
            padding: 12px;
            box-sizing: border-box;
            border: 2px solid #ccc;
            border-radius: 4px;
            background-color: #f8f8f8;
            font-size: 16px;
            resize: none;
        }
    </style>
</head>

<body>

    <h2>Styling textarea</h2>

    <p><strong>Tip:</strong> Use the resize property to prevent textareas from being resized (disable the "grabber" in
        the bottom right corner):</p>

    <form>
        <textarea>Some text...</textarea>
    </form>

</body>

</html>
