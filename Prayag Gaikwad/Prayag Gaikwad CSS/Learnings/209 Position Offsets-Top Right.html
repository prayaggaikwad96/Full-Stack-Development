<!DOCTYPE html>
<html>

<head>
    <style>
        body {
            background-color: rgb(191, 204, 245);
        }

        .container {
            position: relative;
        }

        .topright {
            position: absolute;
            top: 8px;
            right: 10px;
            font-size: 20px;
        }

        img {
            width: 100%;
            height: auto;
            opacity: 0.5;
        }
    </style>
</head>

<body>

    <h2>Position Text on Image</h2>

    <p>Position a text on an image in the top left corner:</p>

    <div class="container">
        <img src="../CSS Images/city-lights-moon-vibrant-4k-30.jpg" alt="Cinque Terre" width="1000" height="300">
        <div class="topright">Top Right</div>
    </div>

</body>

</html>
