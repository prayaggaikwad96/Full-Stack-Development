<!DOCTYPE html>
<html>

<head>
    <style>
        body{
            background-color: antiquewhite;
            text-align: center;
        }
        ul.demo {
            list-style-type: none;
            margin: 0;
            padding: 0;
        }
    </style>
</head>

<body>

    <h1>list-style-type: none</h1>

    <p>Default list:</p>
    <ul>
        <li>Coffee</li>
        <li>Tea</li>
        <li>Coca Cola</li>
    </ul>

    <p>Remove bullets, margin and padding from list:</p>
    <ul class="demo">
        <li>Coffee</li>
        <li>Tea</li>
        <li>Coca Cola</li>
    </ul>

</body>

</html>
