<!DOCTYPE html>
<html>

<head>
    <style>
        body{
            background-color: rgb(142, 183, 249);
            text-align: center;
        }

        input[type=button],
        input[type=submit],
        input[type=reset] {
            background-color: #a1def7;
            border: none;
            color: white;
            padding: 16px 32px;
            text-decoration: none;
            margin: 4px 2px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h2>Styling form buttons</h2>

    <form>
        <input type="button" value="Button">
        <input type="reset" value="Reset">
        <input type="submit" value="Submit">
    </form>

</body>

</html>
