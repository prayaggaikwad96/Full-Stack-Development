<!DOCTYPE html>
<html>
<head>
<style>
    body{
          background-color:powderblue ;
    }

a:link {
  text-decoration: none;
}

a:visited {
  text-decoration: none;
}

a:hover {
  text-decoration: underline;
}

a:active {
  text-decoration: underline;
}
</style>
</head>
<body>

<h1>Style a link with text-decoration</h1>

<p><a href="https://www.tpointtech.com/" target="_blank"> t point tech </a></p>

<p><b>Note:</b> :hover must come after :link and :visited in order to be effective.</p>
<p><b>Note:</b> :active must come after :hover in order to be effective.</p>

</body>
</html>
