<!DOCTYPE html>
<html>

<head>
    <title>Multiple Text Decoration Colors</title>
    <style>
        h1 {
            /* Multiple text decorations sharing the same color */
            text-decoration: underline line-through overline;
            text-decoration-color:rgb(252, 196, 127);
            /* Optional: colors the decorations */

            /* Fixed borders with proper width, style, and color */
            border-bottom: 3px solid rgb(151, 151, 251);
            border-top: 3px solid rgb(227, 132, 74);
            border-left: 3px solid yellow;

            display: inline-block;
            padding: 10px;
        }
    </style>
</head>

<body>

    <h1>Hello World</h1>

</body>

</html>
