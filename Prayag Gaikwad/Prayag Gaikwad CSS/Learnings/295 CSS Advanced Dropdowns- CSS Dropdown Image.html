<!DOCTYPE html>
<html>

<head>
    <style>
        body{
            background-color: rgb(173, 208, 245);
        }
        .dropdown {
            position: relative;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            background-color: #f9f9f9;
            min-width: 160px;
        }

        .dropdown:hover .dropdown-content {
            display: block;
        }

        .desc {
            padding: 15px;
            text-align: center;
        }

    </style>
</head>

<body>

    <h2>Dropdown Image</h2>
    <p>Move the mouse over the image below to open the dropdown content.</p>

    <div class="dropdown">
        <img src="../CSS Images/city-lights-moon-vibrant-4k-30.jpg" alt="City Lights Moon Vibrant" width="100" height="50">
        <div class="dropdown-content"> 

            <img src="../CSS Images/trevi-fountain-rome-italy-uhd-4k-wallpaper.jpg" alt="Trevi Fountain Rome Italy" width="300" height="200">
            <div class="desc">Trevi Fountain Rome Italy</div>
        </div>
    </div>

</body>

</html>
