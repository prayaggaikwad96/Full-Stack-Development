<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z-index Example</title>

    <style>
        .container {
            position: relative;
            min-height: 200px;
        }

        .black-box {
            position: relative;
            z-index: 1;
            border: 2px solid black;
            height: 100px;
            margin: 30px;
            padding: 10px;
            background-color: white;
        }

        .gray-box {
            position: absolute;
            z-index: 3;
            background-color: lightgray;
            height: 60px;
            width: 70%;
            left: 50px;
            top: 50px;
            padding: 5px;
        }

        .green-box {
            position: absolute;
            z-index: 2;
            background-color: green;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            width: 35%;
            height: 100px;
            left: 270px;
            top: -15px;
        }

        .image-option {
            margin: 20px 0;
        }

        #preview {
            display: block;
            max-width: 250px;
            max-height: 150px;
            margin-top: 10px;
        }
    </style>
</head>

<body>

    <h1>Z-index Example</h1>

    <p>
        An element with greater stack order is always above
        an element with a lower stack order.
    </p>

    <div class="image-option">
        <label for="imageUpload">Choose an image:</label>
        <input type="file" id="imageUpload" accept="image/*">
        <img id="preview" alt="Selected image preview" hidden>
    </div>

    <div class="container">
        <div class="black-box">Black box (z-index: 1)</div>
        <div class="gray-box">Gray box (z-index: 3)</div>
        <div class="green-box" id="greenBox">
            Green box (z-index: 2)
        </div>
    </div>

    <script>
        const imageUpload = document.getElementById("imageUpload");
        const greenBox = document.getElementById("greenBox");
        const preview = document.getElementById("preview");

        imageUpload.addEventListener("change", function () {
            const file = this.files[0];

            if (file && file.type.startsWith("image/")) {
                const imageURL = URL.createObjectURL(file);

                greenBox.style.backgroundImage =
                    `url("${imageURL}")`;

                preview.src = imageURL;
                preview.hidden = false;
            }
        });
    </script>

</body>

</html>
