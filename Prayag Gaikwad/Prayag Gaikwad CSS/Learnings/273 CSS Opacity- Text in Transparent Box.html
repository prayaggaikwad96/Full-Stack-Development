<!DOCTYPE html>
<html>

<head>
    <title>Transparent Background</title>

    <style>
        div.background {
            background-image: url("file:///D:/Prayag%20Gaikwad%201/Prayag%20Gaikwad%20CSS/CSS%20Images/795093-3840x2160-desktop-4k-gradient-wallpaper-photo.jpg");
            background-repeat: repeat;
            background-size: cover;
            background-position: center;
            border: 2px solid black;
        }

        div.transbox {
            margin: 30px;
            background-color: rgba(255, 255, 255, 0.6);
            border: 1px solid black;
        }

        div.transbox p {
            margin: 5%;
            font-weight: bold;
            color: #000000;
        }
    </style>
</head>

<body>

    <div class="background">
        <div class="transbox">
            <p>This is some text that is placed in the transparent box.</p>
        </div>
    </div>

</body>

</html>
