<!DOCTYPE html>
<html>

<head>
    <style>
        body{
            background-color: rgb(199, 223, 245);
            text-align: center;
        }
        h1 {
            font-size: 40px;
        }

        h2 {
            font-size: 25px;
        }

        p {
            font-size: 17px;
            border: 1px solid green;
            padding: 10px;
        }
    </style>
</head>

<body>

    <h1>This is heading 1</h1>
    <h2>This is heading 2</h2>
    <p>This is a paragraph.</p>

</body>

</html>
