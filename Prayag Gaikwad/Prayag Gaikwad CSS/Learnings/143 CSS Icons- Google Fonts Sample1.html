<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <!-- Google Fonts Preconnects -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Combined Google Fonts Stylesheet Link -->
    <link href="https://fonts.googleapis.com/css2?family=Bitcount+Ink:wght@100..900&family=Isometra&display=swap"
        rel="stylesheet">

    <style>
        /* Example usage classes to make sure the fonts display */
        .bitcount-text {
            font-family: "Bitcount Ink", sans-serif;
            font-size: 2rem;
        }

        .isometra-text {
            font-family: "Isometra", sans-serif;
            font-size: 2rem;
        }
    </style>
</head>

<body>
    <h1 class="bitcount-text">This is Bitcount Ink Font</h1>
    <h1 class="isometra-text">This is Isometra Font</h1>
</body>

</html>
