<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Hello Page</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background-color: aliceblue;
            background-image: url("https://images.unsplash.com/photo-1762170905134-e9e3b5692286?fm=jpg&q=60&w=3000&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMJA3fDA%3D");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            font-family: Arial, sans-serif;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        h1 {
            font-size: clamp(3rem, 10vw, 8rem);
            color: white;
            text-shadow: 2px 2px 8px black;
            margin-bottom: 20px;
        }

        p {
            font-size: clamp(1rem, 2vw, 1.25rem);
            color: white;
            text-shadow: 1px 1px 4px black;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>
    <h1>Japan</h1>

    <p>Japanese</p>
    <p>Japanese Culture </p>
</body>

</html>
