<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>target _blank Example</title>
</head>

<body>

    <h1>target="_blank" Example</h1>

    <p>
        Click the link below. YouTube will open in a new tab.
    </p>

    <a href="https://www.youtube.com"
       target="_blank"
       rel="noopener noreferrer">
        Open YouTube
    </a>

</body>

</html>
