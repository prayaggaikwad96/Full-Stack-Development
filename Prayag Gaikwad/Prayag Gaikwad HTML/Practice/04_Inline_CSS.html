<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Inline CSS Travel Card</title>
</head>
<body style="margin: 0; background-color: #eef4f1; color: #183330; font-family: Arial, sans-serif;">
	<main style="width: 90%; max-width: 440px; margin: 50px auto; overflow: hidden; border-radius: 18px; background-color: white; box-shadow: 0 14px 35px rgba(24, 51, 48, 0.15);">
		<div style="padding: 34px 28px; background-color: #183330; color: white;">
			<p style="margin: 0 0 12px; color: #f7b39b; font-size: 12px; font-weight: bold; letter-spacing: 2px; text-transform: uppercase;">Weekend escape</p>
			<h1 style="margin: 0; font-size: 36px; line-height: 1.1;">Find your calm.</h1>
			<p style="margin: 14px 0 0; color: #dbe8e3; font-size: 15px; line-height: 1.6;">A quiet two-night stay surrounded by green hills, fresh air, and good coffee.</p>
		</div>

		<div style="padding: 28px;">
			<div style="display: flex; justify-content: space-between; gap: 16px; margin-bottom: 24px;">
				<div>
					<p style="margin: 0 0 5px; color: #71817d; font-size: 12px; text-transform: uppercase;">Location</p>
					<p style="margin: 0; font-weight: bold;">Munnar, Kerala</p>
				</div>
				<div style="text-align: right;">
					<p style="margin: 0 0 5px; color: #71817d; font-size: 12px; text-transform: uppercase;">Rating</p>
					<p style="margin: 0; font-weight: bold; color: #c87732;">&#9733; 4.9</p>
				</div>
			</div>

			<div style="padding: 16px; border-radius: 10px; background-color: #eef4f1;">
				<p style="margin: 0 0 8px; font-weight: bold;">Your stay includes</p>
				<p style="margin: 0; color: #5d6e69; font-size: 14px; line-height: 1.8;">&#10003; Breakfast for two<br>&#10003; Guided tea garden walk<br>&#10003; Free cancellation</p>
			</div>

			<div style="display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: 26px;">
				<p style="margin: 0; color: #5d6e69; font-size: 14px;">From <strong style="color: #183330; font-size: 22px;">$120</strong> / night</p>
				<a href="#book" style="padding: 12px 17px; border-radius: 8px; background-color: #ef765d; color: white; font-size: 14px; font-weight: bold; text-decoration: none;">Book now</a>
			</div>
		</div>
	</main>
</body>
</html>
