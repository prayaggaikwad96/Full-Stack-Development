<!DOCTYPE html>
<html lang="en">
<head>
    <style>

        table,th,td{
            border: 1px solid black;

        }

        table{
            border-spacing: 40px;
        }

    </style>
</head>
<body>

    <h2> Cell Spacing </h2>

    <p> Change the space between the cells with the border spacing property. </p>
    <table style="width:100%">

        <tr>
            <th> First Name </th>
            <th>Last Name</th>
            <th>Age</th>
        </tr>

        <tr>
            <td> Jill </td>
            <td> Smith </td>
            <td> 50 </td>
        </tr>

        <tr>
            <td> John </td>
            <td> Doe </td>
            <td> 30 </td>
        </tr>

        <tr>
            <td> Eve</td>
            <td> Jackson </td>
            <td> 28 </td>
        </tr>

        <tr>
            <td> Adam </td>
            <td> Johnson </td>
            <td> 45 </td>
        </tr>
        
    </table>

</body>
</html>
