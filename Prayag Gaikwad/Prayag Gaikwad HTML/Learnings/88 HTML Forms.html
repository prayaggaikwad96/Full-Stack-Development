<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Forms</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #f6d365, #fda085, #a8dadc);
            color: #1f1f1f;
        }

        .form-wrap {
            width: 100%;
            display: grid;
            place-items: center;
            padding: 20px;
        }

        form {
            background: rgba(255, 255, 255, 0.85);
            padding: 24px 28px;
            border-radius: 16px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.12);
            width: 420px;
            max-width: 100%;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        form:hover {
            transform: translateY(-2px);
            box-shadow: 0 16px 35px rgba(0, 0, 0, 0.16);
        }

        h2 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 10px 12px;
            margin-bottom: 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 1rem;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #2d6cdf;
            box-shadow: 0 0 0 3px rgba(45, 108, 223, 0.15);
        }

        input[type="submit"] {
            width: 100%;
            background: #2d6cdf;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        input[type="submit"]:hover {
            background: #214fb3;
        }

        p {
            text-align: center;
            margin-top: 18px;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        code {
            font-family: Consolas, monospace;
            background: rgba(255, 255, 255, 0.5);
            padding: 2px 6px;
            border-radius: 5px;
        }
    </style>
</head>

<body>
    <div class="form-wrap">
        <form action="/action_page.php" method="get">
            <h2>HTML Forms</h2>

            <label for="fname">First name:</label>
            <input type="text" id="fname" name="fname" value="John">

            <label for="lname">Last name:</label>
            <input type="text" id="lname" name="lname" value="Doe">

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" placeholder="Enter your password">

            <input type="submit" value="Submit">
        </form>

        <p>
            If you click the "Submit" button, the form-data will be sent to
            <code>/action_page.php</code>.
        </p>
    </div>
</body>
</html>
