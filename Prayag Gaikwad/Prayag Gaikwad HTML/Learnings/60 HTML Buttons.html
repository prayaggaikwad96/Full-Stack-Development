<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HTML Buttons</title>

    <style>
        body {
            margin: 0;
            padding: 50px 20px;
            min-height: 100vh;
            text-align: center;
            font-family: Arial, sans-serif;

            /* Two-color background */
            background: linear-gradient(
                to right,
                powderblue,
                lightyellow
            );
        }

        .container {
            max-width: 700px;
            margin: auto;
            padding: 40px;

            background-color: white;

            border: 3px solid black;
            border-radius: 20px;

            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        h1 {
            color: darkblue;
            margin-bottom: 20px;
        }

        p {
            color: #333;
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 30px;
            font-weight: bold;
        }

        button {
            background-color: tomato;
            color: white;

            font-size: 18px;
            font-weight: bold;

            padding: 15px 35px;

            border: 2px solid darkred;
            border-radius: 12px;

            cursor: pointer;

            transition: 0.3s;
        }

        button:hover {
            background-color: orange;
            color: black;

            transform: scale(1.1);

            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>HTML Buttons</h1>

        <p>
            This is a basic HTML button. It can be clicked,
            but it will not do anything until you add an action to it.
        </p>

        <button>Click Me</button>

    </div>

</body>

</html>
