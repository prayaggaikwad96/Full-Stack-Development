<!DOCTYPE html>
<html lang="en">
<head>

    <style> 
        table, th, td {
            border: 3px solid black;
            border-collapse: collapse;
        }

        th, td {
            padding-top: 10px;
            padding-bottom: 20px;
            padding-left: 30px;
            padding-right: 40px;

        }
        
    </style>
</head>
<body>

    <h2> Cell Padding Top-Bottom-Left-Right </h2>

<p> We can specify padding for all four sides of the cell content </p>

    <table style="width:100%">

        <tr>
            <th> First Name </th>
            <th>Last Name</th>
            <th>Age</th>
        </tr>

        <tr>
            <td> Jill </td>
            <td> Smith </td>
            <td> 50 </td>
        </tr>

        <tr>
            <td> John </td>
            <td> Doe </td>
            <td> 30 </td>
        </tr>

        <tr>
            <td> Eve</td>
            <td> Jackson </td>
            <td> 28 </td>
        </tr>

        <tr>
            <td> Adam </td>
            <td> Johnson </td>
            <td> 45 </td>
        </tr>

        <tr>
            <td> John </td>
            <td> Doe </td>
            <td> 90 </td>
        </tr>
    </table>

</body>
</html>
