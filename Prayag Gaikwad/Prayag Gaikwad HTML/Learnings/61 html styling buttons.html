```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HTML Buttons</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;

            /* Two background colors */
            background: linear-gradient(to right, powderblue, lightyellow);

            text-align: center;
            padding: 40px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            padding: 35px;

            background-color: white;

            border: 2px solid #333;
            border-radius: 20px;

            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        h1 {
            color: #222;
            margin-bottom: 30px;
            text-decoration: underline;
        }

        p {
            font-size: 18px;
            font-weight: bold;
            margin-top: 30px;
            margin-bottom: 15px;
        }

        button {
            font-size: 15px;
            padding: 12px 25px;

            border: 2px solid black;
            border-radius: 8px;

            cursor: pointer;

            transition: 0.3s;
        }

        /* Default Button */
        .defaultbtn {
            background-color: lightgray;
            color: black;
        }

        .defaultbtn:hover {
            background-color: gray;
            color: white;

            transform: scale(1.08);
        }

        /* Green Button */
        .testbtn {
            background-color: #04AA6D;
            color: white;

            border: none;

            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
        }

        .testbtn:hover {
            background-color: #059862;

            transform: scale(1.1);

            box-shadow: 0 7px 15px rgba(0, 0, 0, 0.3);
        }

        .testbtn:active {
            transform: scale(0.95);
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>HTML Buttons</h1>

        <p>Default button with simple styling:</p>

        <button class="defaultbtn">
            Click Me
        </button>


        <p>Styled Green Button:</p>

        <button class="testbtn">
            Green Button
        </button>

    </div>

</body>

</html>
```
