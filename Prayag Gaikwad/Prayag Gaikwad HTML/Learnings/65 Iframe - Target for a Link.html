<!DOCTYPE html>
<html>
<body>

<h2>Iframe - Target for a Link</h2>

<iframe src="about:blank" name="iframe_a" height="300px" width="100%" title="Iframe Example"></iframe>

<!-- Changed the URL to a site that allows iframes -->
<p><a href="https://example.com" target="iframe_a">Click here to load Example.com in the iframe</a></p>

<p>When the target attribute of a link matches the name of an iframe, the link will open in the iframe.</p>

</body>
</html>
