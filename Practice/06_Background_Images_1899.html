<!DOCTYPE html>
<html>

<head>
    <style>
        /* Ensures the HTML and body fill the entire screen height */
        html,
        body {
            height: 100%;
            margin: 0;
        }

        /* Applies the full-screen background to the body */
        body {
            background-image: url('../1899/bg.jpg');
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;

            /* Optional: Centers the text and makes it readable */
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-family: Arial, sans-serif;
            font-size: 1.2rem;
            text-align: center;
        }
    </style>
</head>

<body>

    <div>
        <h2> 1899</h2>
        <p> Netflix </p>
    </div>

</body>

</html>
