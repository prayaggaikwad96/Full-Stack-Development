<!DOCTYPE html>
<html>

<head>
    <style>
        a:link {
            color: blue;
            background-color: transparent;
            text-decoration: none;
        }

        a:visited {
            color: violet;
            background-color: transparent;
            text-decoration: none;
        }

        a:hover {
            color: green;
            background-color: transparent;
            text-decoration: underline;
        }

        a:active {
            color: orange;
            background-color: transparent;
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <h2>Link Colors</h2>

    <p>You can change the default colors of links</p>

    <a href="https://www.youtube.com" target="_blank">YouTube</a>

</body>

</html>
