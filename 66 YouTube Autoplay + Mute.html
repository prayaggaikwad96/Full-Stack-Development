<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            min-height: 100vh;

            background:
                linear-gradient(140deg, rgb(167, 200, 244), rgb(90, 149, 176), blue),
                radial-gradient(circle at top left, #53ced5, transparent 35%),
                radial-gradient(circle at bottom right, #58cff4, transparent 40%);

            border: 3px solid black;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);

            text-align: center;
            box-sizing: border-box;
        }

        iframe {
            width: 100%;
            height: 500px;
            border: none;
        }
    </style>
</head>

<body>

    <iframe src="https://www.youtube.com/embed/k7OooFaXW5Q?autoplay=1&mute=1" title="YouTube Video"
        allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen>
    </iframe>

</body>

</html>
