<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HTML Forms</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;

            background:
                radial-gradient(circle at top left, #53ced5, transparent 35%),
                radial-gradient(circle at bottom right, #58cff4, transparent 40%),
                linear-gradient(215deg, #d17e7e, #d08989, #6cb7f1);

            font-family: Arial, sans-serif;
        }

        .box {
            width: 400px;
            padding: 35px;

            background:
                radial-gradient(circle at top left, #53ced5, transparent 35%),
                radial-gradient(circle at bottom right, #58cff4, transparent 40%),
                linear-gradient(135deg, #8baec1, #236d9b, #92bdde);

            border: 3px solid black;
            border-radius: 15px;

            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);

            text-align: center;
        }

        h2 {
            margin-top: 0;
        }

        form {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        label {
            font-weight: bold;
            margin-top: 5px;
        }

        input,
        select,
        textarea {
            width: 80%;
            padding: 10px;
            margin: 5px 0 15px;

            border: 1px solid #555;
            border-radius: 6px;

            font-size: 15px;
        }

        .gender {
            margin: 5px 0 15px;
        }

        .gender input {
            width: auto;
            margin: 5px;
        }

        .buttons {
            width: 80%;
            display: flex;
            gap: 10px;
        }

        input[type="submit"],
        input[type="reset"] {
            width: 50%;
            margin: 0;
            border: none;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        input[type="submit"] {
            background: #236d9b;
        }

        input[type="reset"] {
            background: #555;
        }

        input[type="submit"]:hover {
            background: #185577;
        }

        input[type="reset"]:hover {
            background: #333;
        }

        p {
            font-size: 13px;
            margin-bottom: 0;
        }
    </style>
</head>

<body>

    <div class="box">

        <h2>📝 Registration Form</h2>

        <form action="/action_page.php">

            <label for="fname">First Name:</label>
            <input type="text" id="fname" name="fname" placeholder="Enter your first name" required>

            <label for="lname">Last Name:</label>
            <input type="text" id="lname" name="lname" placeholder="Enter your last name" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" placeholder="Enter your password" required>

            <label for="age">Age:</label>
            <input type="number" id="age" name="age" placeholder="Enter your age">

            <label>Gender:</label>

            <div class="gender">
                <input type="radio" id="male" name="gender">
                <label for="male">Male</label>

                <input type="radio" id="female" name="gender">
                <label for="female">Female</label>

                <input type="radio" id="other" name="gender">
                <label for="other">Other</label>
            </div>

            <label for="country">Country:</label>

            <select id="country" name="country">
                <option> Select Country </option>
                <option> India </option>
                <option> USA </option>
                <option> UK </option>
                <option> Canada </option>
                <option> China </option>
                <option> Japan </option>
                <option> North Korea </option>
                <option> South Korea </option>
            </select>

            <label for="message">Message:</label>

            <textarea id="message" name="message" placeholder="Write your message..."></textarea>

            <div class="buttons">
                <input type="submit" value="Submit">
                <input type="reset" value="Reset">
            </div>

        </form>

        <p>Fill in the form and click Submit.</p>

    </div>

</body>

</html>
