name: Feature request
description: Suggest an improvement to the repository or one of its projects.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Before filing, search existing issues and avoid including secrets or private data.
  - type: textarea
    id: problem
    attributes:
      label: What problem should this solve?
      description: Describe the need or use case and identify the affected project or repository path.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Explain what you would like to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any alternative approaches or workarounds.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add relevant examples or screenshots, with private data removed.
    validations:
      required: false
