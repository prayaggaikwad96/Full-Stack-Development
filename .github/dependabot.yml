version: 2

updates:
  # Keep GitHub Actions references current, including immutable SHA pins.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 10
    groups:
      github-actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci(deps)"
      include: "scope"

  # Add ecosystem entries only when a corresponding manifest/lockfile exists.
  # CodePilot currently uses Python's standard library and browser JavaScript;
  # no pip/npm/Docker/etc. dependency manifest exists in this repository.
