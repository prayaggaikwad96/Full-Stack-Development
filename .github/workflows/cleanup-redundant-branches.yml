name: Audit redundant branch aliases

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cleanup-redundant-branches.yml"
  workflow_dispatch:

# Intentionally read-only: local Git refs and backups cannot be inspected by
# GitHub Actions. This workflow reports candidates but never deletes branches.
permissions:
  contents: read

jobs:
  audit:
    name: Audit legacy branches without deleting refs
    runs-on: ubuntu-latest
    steps:
      - name: Check out full branch history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Report branch reachability
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          # Keep this list explicit. Add a branch only after deciding it is a
          # legacy candidate; never include the live Developer mirror or the
          # intentional CodePilot history archive.
          for branch in github-sync archive/developer-before-sync-2026-10-27 integration/codepilot-free-main-sync feat/codepilot-free-app backup/legacy-tree-before-cleanup-2026-10-27 docs/github-profile-readme profile/readme-final; do
            remote_ref="refs/remotes/origin/$branch"
            if ! git show-ref --verify --quiet "$remote_ref"; then
              echo "Already absent: $branch"
            elif git merge-base --is-ancestor "$remote_ref" refs/remotes/origin/main; then
              echo "Candidate only: $branch is contained in main; verify local references and backups manually before deletion."
            else
              echo "Preserve: $branch has commits not reachable from main. Review its unique history before any deletion."
            fi
          done
