name: Clean up redundant branch aliases

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cleanup-redundant-branches.yml"
  workflow_dispatch:

# This workflow is intentionally read-only. Branch deletion requires review of
# local Git refs and backups; automation cannot inspect the contributor's PC.
permissions:
  contents: read

jobs:
  audit:
    name: Audit redundant branch aliases without deleting refs
    runs-on: ubuntu-latest
    steps:
      - name: Check out full branch history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Report aliases already contained in main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          for branch in github-sync archive/developer-before-sync-2026-10-27 integration/codepilot-free-main-sync feat/codepilot-free-app backup/legacy-tree-before-cleanup-2026-10-27; do
            remote_ref="refs/remotes/origin/$branch"
            if ! git show-ref --verify --quiet "$remote_ref"; then
              echo "Already absent: $branch"
            elif git merge-base --is-ancestor "$remote_ref" refs/remotes/origin/main; then
              echo "Candidate only: $branch is contained in main; manual local-reference check is still required before deletion."
            else
              echo "Preserve: $branch contains commits not reachable from main."
            fi
          done
