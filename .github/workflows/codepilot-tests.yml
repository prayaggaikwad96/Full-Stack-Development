name: CodePilot tests

on:
  pull_request:
    paths:
      - "projects/codepilot-free/**"
      - ".github/workflows/codepilot-tests.yml"
  push:
    branches: [main, feat/codepilot-free-app, integration/codepilot-free-main-sync]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} / Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 remains a supported baseline; 3.14 is current stable maintenance.
        # 3.15 is included as a forward-compatibility signal while dependencies are minimal.
        python-version: ["3.12", "3.14", "3.15"]
        node-version: ["20"]
        include:
          - python-version: "3.13"
            node-version: "20"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: ""
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Check Python syntax
        working-directory: projects/codepilot-free
        run: python -m py_compile app.py tests/test_app.py
      - name: Check browser JavaScript syntax
        working-directory: projects/codepilot-free
        run: node --check static/app.js
      - name: Run API integration tests
        working-directory: projects/codepilot-free
        run: python -m unittest discover -s tests -v
