name: CodePilot tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "projects/codepilot-free/**"
      - ".github/workflows/codepilot-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} / Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15"]
        node-version: ["22", "24"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: ""
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - name: Check Python syntax
        working-directory: projects/codepilot-free
        run: python -m py_compile app.py tests/test_app.py
      - name: Check browser JavaScript syntax
        working-directory: projects/codepilot-free
        run: node --check static/app.js
      - name: Run API integration tests
        working-directory: projects/codepilot-free
        run: python -m unittest discover -s tests -v
