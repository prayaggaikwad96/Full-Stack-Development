<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Name Attribute Form</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            /* Modern, vibrant radial gradient */
            background: radial-gradient(circle at center, #667eea 0%, #764ba2 100%);

            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .box {
            width: 100%;
            max-width: 500px;
            padding: 30px;
            /* Custom soft blue background with smooth transition */
            background-color: rgba(137, 222, 248, 0.95);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(103, 161, 207, 0.2);
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease, background-color 0.3s ease;
        }

        /* Enhanced Full Box Hover Effect - Stays Blue */
        .box:hover {
            transform: translateY(-8px) scale(1.01);
            background-color: rgba(120, 210, 245, 1);
            /* Stays solid blue on hover */
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3), 0 0 20px rgba(137, 222, 248, 0.6);
            /* Blue glow */
        }

        h2 {
            margin-top: 0;
            color: #222;
        }

        form {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        label.field-label {
            font-weight: 600;
            color: #444;
            margin-top: 15px;
            text-align: center;
            width: 100%;
        }

        input[type="text"],
        input[type="password"] {
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            width: 100%;
            text-align: center;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        /* Input field hover & focus effects */
        input[type="text"]:hover,
        input[type="password"]:hover {
            border-color: #764ba2;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: #764ba2;
            outline: none;
            box-shadow: 0 0 6px rgba(118, 75, 162, 0.35);
        }

        /* Radio button container styles */
        .radio-group {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 8px;
            width: 100%;
        }

        .radio-option {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: normal;
            color: #444;
            cursor: pointer;
            transition: color 0.2s ease;
        }

        /* Radio option hover effect */
        .radio-option:hover {
            color: #764ba2;
        }

        .radio-option input[type="radio"] {
            cursor: pointer;
            accent-color: #764ba2;
        }

        input[type="submit"] {
            margin-top: 25px;
            padding: 12px 30px;
            background-color: #764ba2;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
        }

        /* Submit Button Hover Effect */
        input[type="submit"]:hover {
            background-color: #5a377d;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(90, 55, 125, 0.4);
        }

        /* Click press effect for submit button */
        input[type="submit"]:active {
            transform: translateY(1px);
            box-shadow: 0 2px 5px rgba(90, 55, 125, 0.3);
        }

        p {
            color: #555;
            font-size: 14px;
            line-height: 1.5;
            margin-top: 20px;
            margin-bottom: 0;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="box">

        <h2>The Name Attribute</h2>
        <form>

            <label class="field-label" for="fname">First name:</label>
            <input type="text" id="fname" name="fname" value="Prayag">

            <label class="field-label" for="lname">Last name:</label>
            <input type="text" id="lname" name="lname" value="Gaikwad">

            <label class="field-label" for="password">Password:</label>
            <input type="password" id="password" name="password" value="Password">

            <!-- Gender radio buttons -->
            <label class="field-label">Gender:</label>
            <div class="radio-group">
                <label class="radio-option">
                    <input type="radio" name="gender" value="male" checked> Male
                </label>
                <label class="radio-option">
                    <input type="radio" name="gender" value="female"> Female
                </label>
                <label class="radio-option">
                    <input type="radio" name="gender" value="other"> Other
                </label>
            </div>

            <input type="submit" value="Submit">

        </form>

        <p>
            If you click the "Submit" button, the form data will be sent to a page called "/action_page.php".
        </p>

        <p>
            Notice that an input element needs a <strong>name</strong>
            attribute for its value to be included in the submitted form data.
        </p>

    </div>
    
</body>

</html>
