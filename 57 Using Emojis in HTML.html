<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Emojis</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background:
                radial-gradient(circle at top left, #53ced5, transparent 35%),
                radial-gradient(circle at bottom right, #58cff4, transparent 40%),
                linear-gradient(135deg, #de9a9a, #d08989, #6293b9);
        }

        .box {
            padding: 40px;

            background:
                radial-gradient(circle at top left, #53ced5, transparent 35%),
                radial-gradient(circle at bottom right, #58cff4, transparent 40%),
                linear-gradient(135deg, #8baec1, #236d9b, #92bdde);

            border: 3px solid black;
            border-radius: 15px;

            text-align: center;

            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        h1 {
            margin: 0 0 20px;
        }

        h2 {
            margin: 0;
            font-size: 40px;
        }
    </style>
</head>

<body>

    <div class="box">
        <h1>Using Emojis in HTML</h1>
        <h2>✈️ 🚗 🚋</h2>
    </div>

</body>
