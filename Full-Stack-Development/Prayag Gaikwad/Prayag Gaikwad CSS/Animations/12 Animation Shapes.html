<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Shapes Animation</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background-color: powderblue;
            font-family: Arial, sans-serif;
            overflow-x: hidden;
        }

        h1 {
            text-align: center;
            margin: 25px 0 40px;
        }

        /* Main Container */
        .container {
            width: min(740px, calc(100% - 20px));
            margin: 0 auto;
            display: grid;
            grid-template-columns: 120px minmax(0, 500px) 120px;
            align-items: center;
        }

        /* Center Box */
        .outer-box {
            height: 400px;
            border: 3px solid black;
            position: relative;
            background-color: transparent;
        }

        /* Side Columns */
        .side {
            height: 400px;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
            position: relative;
            z-index: 2;
        }

        /* Common Shape Properties */
        .shape {
            flex-shrink: 0;
            animation-duration: 3s;
            animation-delay: 1s;
            animation-iteration-count: infinite;
            animation-timing-function: ease-in-out;
        }

        /* Circle and Square */
        .circle,
        .square {
            width: 60px;
            height: 60px;
            border: 3px solid black;
        }

        .circle {
            border-radius: 50%;
            animation-name: circleAnimation;
        }

        .square {
            animation-name: squareAnimation;
        }

        /* Triangle */
        .triangle {
            width: 0;
            height: 0;
            border-left: 35px solid transparent;
            border-right: 35px solid transparent;
            border-bottom: 65px solid black;
            animation-name: triangleAnimation;
        }

        /* Kite */
        .kite {
            width: 65px;
            height: 80px;
            background-color: black;
            clip-path: polygon(
                50% 0%,
                100% 35%,
                50% 100%,
                0% 35%
            );
            animation-name: kiteAnimation;
        }

        /* Hexagon */
        .hexagon {
            width: 70px;
            height: 60px;
            background-color: black;
            clip-path: polygon(
                25% 0%,
                75% 0%,
                100% 50%,
                75% 100%,
                25% 100%,
                0% 50%
            );
            animation-name: hexagonAnimation;
        }

        /* Octagon */
        .octagon {
            width: 70px;
            height: 70px;
            background-color: black;
            clip-path: polygon(
                30% 0%,
                70% 0%,
                100% 30%,
                100% 70%,
                70% 100%,
                30% 100%,
                0% 70%,
                0% 30%
            );
            animation-name: octagonAnimation;
        }

        /* =========================
           LEFT SIDE ANIMATIONS
           ========================= */

        @keyframes circleAnimation {
            0%,
            100% {
                transform: translateX(0) rotate(0deg);
            }

            50% {
                transform: translateX(220px) rotate(360deg);
            }
        }

        @keyframes squareAnimation {
            0%,
            100% {
                transform: translateX(0);
            }

            50% {
                transform: translateX(220px);
            }
        }

        @keyframes triangleAnimation {
            0%,
            100% {
                transform: translate(0, 0) rotate(0deg);
            }

            50% {
                transform: translate(220px, -40px) rotate(180deg);
            }
        }

        /* =========================
           RIGHT SIDE ANIMATIONS
           ========================= */

        @keyframes kiteAnimation {
            0%,
            100% {
                transform: translate(0, 0) rotate(0deg);
            }

            50% {
                transform: translate(-220px, 40px) rotate(180deg);
            }
        }

        @keyframes hexagonAnimation {
            0%,
            100% {
                transform: translateX(0) rotate(0deg);
            }

            50% {
                transform: translateX(-220px) rotate(180deg);
            }
        }

        @keyframes octagonAnimation {
            0%,
            100% {
                transform: translateX(0) rotate(0deg);
            }

            50% {
                transform: translateX(-220px) rotate(360deg);
            }
        }

        /* =========================
           TABLET / MOBILE
           ========================= */

        @media screen and (max-width: 760px) {

            .container {
                width: calc(100% - 20px);
                grid-template-columns: 80px minmax(0, 1fr) 80px;
            }

            .side {
                height: 350px;
            }

            .outer-box {
                height: 350px;
            }

            @keyframes circleAnimation {
                0%,
                100% {
                    transform: translateX(0) rotate(0deg);
                }

                50% {
                    transform: translateX(50px) rotate(360deg);
                }
            }

            @keyframes squareAnimation {
                0%,
                100% {
                    transform: translateX(0);
                }

                50% {
                    transform: translateX(50px);
                }
            }

            @keyframes triangleAnimation {
                0%,
                100% {
                    transform: translate(0, 0) rotate(0deg);
                }

                50% {
                    transform: translate(50px, -30px) rotate(180deg);
                }
            }

            @keyframes kiteAnimation {
                0%,
                100% {
                    transform: translate(0, 0) rotate(0deg);
                }

                50% {
                    transform: translate(-50px, 30px) rotate(180deg);
                }
            }

            @keyframes hexagonAnimation {
                0%,
                100% {
                    transform: translateX(0) rotate(0deg);
                }

                50% {
                    transform: translateX(-50px) rotate(180deg);
                }
            }

            @keyframes octagonAnimation {
                0%,
                100% {
                    transform: translateX(0) rotate(0deg);
                }

                50% {
                    transform: translateX(-50px) rotate(360deg);
                }
            }
        }

        /* Small Mobile Screens */
        @media screen and (max-width: 480px) {

            h1 {
                font-size: 24px;
                margin: 20px 0 30px;
            }

            .container {
                grid-template-columns: 65px minmax(0, 1fr) 65px;
            }

            .side,
            .outer-box {
                height: 300px;
            }

            .circle,
            .square {
                width: 45px;
                height: 45px;
            }

            .triangle {
                border-left-width: 25px;
                border-right-width: 25px;
                border-bottom-width: 45px;
            }

            .kite {
                width: 50px;
                height: 60px;
            }

            .hexagon {
                width: 55px;
                height: 48px;
            }

            .octagon {
                width: 55px;
                height: 55px;
            }

            @keyframes circleAnimation {
                0%,
                100% {
                    transform: translateX(0) rotate(0deg);
                }

                50% {
                    transform: translateX(35px) rotate(360deg);
                }
            }

            @keyframes squareAnimation {
                0%,
                100% {
                    transform: translateX(0);
                }

                50% {
                    transform: translateX(35px);
                }
            }

            @keyframes triangleAnimation {
                0%,
                100% {
                    transform: translate(0, 0) rotate(0deg);
                }

                50% {
                    transform: translate(35px, -20px) rotate(180deg);
                }
            }

            @keyframes kiteAnimation {
                0%,
                100% {
                    transform: translate(0, 0) rotate(0deg);
                }

                50% {
                    transform: translate(-35px, 20px) rotate(180deg);
                }
            }

            @keyframes hexagonAnimation {
                0%,
                100% {
                    transform: translateX(0) rotate(0deg);
                }

                50% {
                    transform: translateX(-35px) rotate(180deg);
                }
            }

            @keyframes octagonAnimation {
                0%,
                100% {
                    transform: translateX(0) rotate(0deg);
                }

                50% {
                    transform: translateX(-35px) rotate(360deg);
                }
            }
        }

        /* Accessibility */
        @media (prefers-reduced-motion: reduce) {
            .shape {
                animation: none;
            }
        }
    </style>
</head>

<body>

    <h1>CSS Shapes Animation</h1>

    <main class="container">

        <!-- Left Side -->
        <section class="side">

            <div class="shape circle"></div>

            <div class="shape triangle"></div>

            <div class="shape square"></div>

        </section>

        <!-- Center Box -->
        <div class="outer-box"></div>

        <!-- Right Side -->
        <section class="side">

            <div class="shape kite"></div>

            <div class="shape hexagon"></div>

            <div class="shape octagon"></div>

        </section>

    </main>

</body>
</html>
