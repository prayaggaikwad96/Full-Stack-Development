<!DOCTYPE html>
<html>

<head>
    <title>CSS Shapes Animation</title>

    <style>
        body {
            background-color: powderblue;
            margin: 0;
        }

        h1 {
            text-align: center;
        }

        .container {
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin-top: 40px;
        }

        .outer-box {
            width: 500px;
            height: 400px;
            border: 3px solid black;
        }

        .side {
            width: 120px;
            height: 400px;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
        }

        .shape {
            position: relative;
            animation-duration: 3s;
            animation-delay: 1s;
            animation-iteration-count: infinite;
        }

        .circle {
            width: 60px;
            height: 60px;
            border: 3px solid black;
            border-radius: 50%;
            animation-name: circle;
        }

        .square {
            width: 60px;
            height: 60px;
            border: 3px solid black;
            animation-name: square;
        }

        .triangle {
            width: 0;
            height: 0;
            border-left: 35px solid transparent;
            border-right: 35px solid transparent;
            border-bottom: 65px solid black;
            animation-name: triangle;
        }

        .kite {
            width: 65px;
            height: 80px;
            background: black;
            clip-path: polygon(50% 0%, 100% 35%, 50% 100%, 0% 35%);
            animation-name: kite;
        }

        .hexagon {
            width: 70px;
            height: 60px;
            background: black;
            clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
            animation-name: hexagon;
        }

        .octagon {
            width: 70px;
            height: 70px;
            background: black;
            clip-path: polygon(30% 0%, 70% 0%, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0% 70%, 0% 30%);
            animation-name: octagon;
        }

        @keyframes circle {
            50% {
                transform: translateX(250px) rotate(360deg);
            }
        }

        @keyframes square {
            50% {
                transform: translateX(250px);
            }
        }

        @keyframes triangle {
            50% {
                transform: translate(250px, -50px) rotate(180deg);
            }
        }

        @keyframes kite {
            50% {
                transform: translate(-250px, 50px) rotate(180deg);
            }
        }

        @keyframes hexagon {
            50% {
                transform: translateX(-250px) rotate(180deg);
            }
        }

        @keyframes octagon {
            50% {
                transform: translateX(-250px) rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <h1>CSS Shapes</h1>

    <div class="container">

        <div class="side">
            <div class="shape circle"></div>
            <div class="shape triangle"></div>
            <div class="shape square"></div>
        </div>

        <div class="outer-box"></div>

        <div class="side">
            <div class="shape kite"></div>
            <div class="shape hexagon"></div>
            <div class="shape octagon"></div>
        </div>

    </div>

</body>

</html>
