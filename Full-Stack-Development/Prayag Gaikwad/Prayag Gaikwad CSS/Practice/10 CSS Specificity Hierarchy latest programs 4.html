<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>!important in @layer & Native CSS Nesting</title>
    <style>
        body {
            background-color: lightblue;
            text-align: center;
            min-height: 100vh;
            margin: 0;
            padding: 1.5rem;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 1.5rem;
        }

        .page {
            max-width: 984px;
            width: 100%;
        }

        .pricing-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: stretch;
            gap: 1.5rem;
            width: 100%;
            max-width: 984px;
        }

        @layer tokens, components;

        @layer tokens {

            /* In !important declarations, EARLIER layers beat LATER layers */
            .alert-banner {
                background: #fef3c7 !important;
                color: #92400e !important;
            }
        }

        @layer components {

            /* Even with a higher selector specificity, !important in `tokens` wins */
            .page .alert-banner {
                background: #fbe2e2 !important;
                color: #991b1b !important;
            }

            /* Native CSS nesting builds compound specificity: .pricing-card .price */
            .pricing-card {
                flex: 1 1 320px;
                max-width: 480px;
                padding: 1.25rem;
                border: 1px solid #e2e8f0;
                border-radius: 10px;
                box-sizing: border-box;
                background-color: #91c5f8;

                & .badge {
                    display: inline-block;
                    margin-bottom: 0.5rem;
                    padding: 0.2rem 0.65rem;
                    border-radius: 999px;
                    font-size: 0.75rem;
                    font-weight: 700;
                    letter-spacing: 0.04em;
                    text-transform: uppercase;
                    background-color: #1e3a8a;
                    color: #ffffff;
                }

                & .price {
                    font-size: 1.5rem;
                    font-weight: 700;
                    color: #0f172a;
                }

                /* & inside a nested rule repeats the parent selector chain */
                & .price.discounted {
                    color: #16a34a;
                }
            }

            .pricing-card.featured {
                border: 2px solid #1e3a8a;
                box-shadow: 0 10px 25px rgba(30, 58, 138, 0.16);
            }
        }
    </style>
</head>

<body>
    <div class="page">
        <div class="alert-banner" style="padding: 0.85rem 1rem; border-radius: 8px;">
            <strong>Notice:</strong> <code>@layer tokens</code> wins over <code>@layer components</code> for
            <code>!important</code>.
        </div>
    </div>

    <div class="pricing-grid">
        <section class="pricing-card">
            <h3>Google AI Pro Plan (₹1,950/month)</h3>
            <p class="price discounted">₹501/month</p>
            <p>Special Diwali Offer</p>
        </section>

        <section class="pricing-card featured">
            <span class="badge">Popular</span>
            <h3>Google AI Ultra Plan (₹24,500/month)</h3>
            <p class="price">₹19,999/month</p>
            <p>Annual &amp; Priority Access</p>
        </section>
    </div>
</body>

</html>
