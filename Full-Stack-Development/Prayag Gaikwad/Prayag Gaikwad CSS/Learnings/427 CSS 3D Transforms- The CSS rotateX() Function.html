<!DOCTYPE html>
<html>

<head>
    <style>
        body{
            background-color: aliceblue;
        }
        .container {
            width: 180px;
            height: 180px;
            border: 1px solid lightgray;
            margin: 30px;
            perspective: 600px;
        }

        .box {
            width: 100%;
            height: 100%;
            background-color: rgb(0, 94, 128);
            transform: rotateX(55deg);
            line-height: 180px;
            text-align: center;
            font-size: 20px;
        }
    </style>
</head>

<body>

    <h1>The rotateX() Function</h1>

    <p>The rotateX() function rotates an element around its X-axis at a given degree.</p>

    <div class="container">
        <div class="box">rotateX(55deg)</div>
    </div>

</body>

</html>
