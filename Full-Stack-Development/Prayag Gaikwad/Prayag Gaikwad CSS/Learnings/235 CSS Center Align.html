<!DOCTYPE html>
<html>

<head>
    <style>
        body{
            background-color: rgb(156, 193, 245);
            text-align: center;
        }
        .center {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 200px;
            border: 3px solid green;
        }
    </style>
</head>

<body>

    <h2>Centering with Flexbox</h2>

    <p>A flex container with both the justify-content and the align-items properties set to center, will align the
        item(s) in the center (in both axis).</p>

    <div class="center">
        <p>I am vertically and horizontally centered.</p>
    </div>

</body>

</html>
