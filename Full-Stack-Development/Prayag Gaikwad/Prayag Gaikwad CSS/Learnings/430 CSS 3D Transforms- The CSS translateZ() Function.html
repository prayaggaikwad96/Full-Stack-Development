<!DOCTYPE html>
<html>

<head>
    <style>
        body{
            background-color: aliceblue;
        }
        .container {
            width: 180px;
            height: 180px;
            border: 1px solid lightgray;
            margin: 40px;
            perspective: 600px;
        }

        .box {
            width: 100%;
            height: 100%;
            background-color: rgb(0, 98, 128);
            transform: translateZ(-150px);
            line-height: 180px;
            text-align: center;
            font-size: 20px;
        }
    </style>
</head>

<body>

    <h1>The translateZ() Function</h1>

    <p>The translateZ() function moves an element closer or further.</p>

    <div class="container">
        <div class="box">translateZ(-150px)</div>
    </div>

</body>

</html>
