<!DOCTYPE html>
<html>

<head>
    <style>
        body{
            background-color: aliceblue;
            text-align: center;
        }
        #grad1 {
            height: 200px;
            background-color: rgb(253, 8, 8);
            /* For browsers that do not support gradients */
            background-image: linear-gradient(to top, rgb(254, 123, 123), rgb(254, 254, 19));
        }
    </style>
</head>

<body>

    <h1>Linear Gradient - Bottom to Top</h1>
    <p>This linear gradient starts red at the bottom, transitioning to yellow at the top:</p>

    <div id="grad1"></div>

</body>

</html>
