<!DOCTYPE html>
<html>

<head>
    <title>CSS Pseudo-elements</title>
    <style>
        p::first-letter {
            color: red;
            font-size: 30px;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <h2>CSS Pseudo-elements Example</h2>
    <p>Hello World! Welcome to CSS.</p>
</body>

</html>
