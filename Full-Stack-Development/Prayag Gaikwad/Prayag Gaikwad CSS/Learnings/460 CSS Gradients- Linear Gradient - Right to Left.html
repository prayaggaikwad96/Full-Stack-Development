<!DOCTYPE html>
<html>

<head>
    <style>
        body {
            background-color: aliceblue;
            text-align: center;
        }

        #grad1 {
            height: 200px;
            background-color: red;
            /* For browsers that do not support gradients */
            background-image: linear-gradient(to left, red, yellow);
        }
    </style>
</head>

<body>

    <h1>Linear Gradient - Right to Left</h1>
    <p>This linear gradient starts red at the right, transitioning to yellow (to the left):</p>

    <div id="grad1"></div>

</body>

</html>
