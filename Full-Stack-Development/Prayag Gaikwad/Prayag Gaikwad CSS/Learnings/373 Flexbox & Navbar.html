<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Container & Navbar</title>

    <style>
        body {
            background-color: rgb(214, 234, 252);
            text-align: center;
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        /* Flexbox Container */
        .parent {
            background-color: dodgerblue;
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            flex-wrap: wrap;
            padding: 10px;
            border-radius: 8px;
            gap: 10px;
        }

        /* Flexbox Items */
        .parent div {
            background-color: #f1f1f1;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 5px;
            padding: 20px;
            font-size: 24px;
            border-radius: 6px;
            cursor: pointer;
            transition: transform 0.3s ease,
                background-color 0.3s ease,
                box-shadow 0.3s ease,
                color 0.3s ease;
        }

        /* Hover Effect */
        .parent div:hover {
            background-color: #ffffff;
            color: #0284c7;
            transform: translateY(-6px);
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.2);
        }

        /* Navigation Bar */
        .navbar {
            display: flex;
            background: #1e293b;
            padding: 15px 25px;
            justify-content: center;
            border-radius: 8px;
            transition: background-color 0.3s ease,
                box-shadow 0.3s ease;
        }

        /* Navbar Hover */
        .navbar:hover {
            background: #0f172a;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
        }

        .navbar .links {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .navbar .links a {
            position: relative;
            color: white;
            text-decoration: none;
            font-family: sans-serif;
            padding: 8px 14px;
            border-radius: 6px;
            transition: color 0.3s ease,
                background-color 0.3s ease,
                transform 0.2s ease;
        }

        /* Animated Underline */
        .navbar .links a::after {
            content: "";
            position: absolute;
            left: 50%;
            bottom: 4px;
            width: 0;
            height: 2px;
            background-color: #38bdf8;
            transition: width 0.3s ease,
                left 0.3s ease;
        }

        /* Navigation Link Hover */
        .navbar .links a:hover {
            color: #38bdf8;
            background-color: rgba(56, 189, 248, 0.12);
            transform: translateY(-2px);
        }

        /* Expand Underline */
        .navbar .links a:hover::after {
            width: 70%;
            left: 15%;
        }

        /* Mobile Responsive Design */
        @media (max-width: 600px) {
            .parent {
                flex-direction: column;
            }

            .parent div {
                justify-content: center;
            }

            .navbar .links {
                gap: 10px;
            }
        }
    </style>
</head>

<body>

    <h1>Create a Flexbox Container & Navbar</h1>

    <!-- Flexbox Container -->
    <div class="parent">
        <div>Item 1</div>
        <div>Item 2</div>
        <div>Item 3</div>
        <div>Item 4</div>
        <div>Item 5</div>
    </div>

    <p>
        Flexbox must have a parent element with the
        display property set to flex or inline-flex.
    </p>

    <p>
        Direct child elements of the flex container
        automatically become flex items.
    </p>

    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="links">
            <a href="#home">Home</a>
            <a href="#about">About</a>
            <a href="#services">Services</a>
            <a href="#contact">Contact</a>
            <a href="https://facebook.com" target="_blank">Facebook</a>
            <a href="https://www.instagram.com/" target="_blank">Instagram</a>
            <a href="https://x.com/" target="_blank">X</a>
        </div>
    </nav>

</body>

</html>
