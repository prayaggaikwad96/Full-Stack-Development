<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Japan City Images</title>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background-color: rgb(72, 202, 245);
            font-family: system-ui, -apple-system, sans-serif;
        }

        #japan1 {
            min-height: 100vh;
            padding: 32px;
            background-color: rgb(72, 202, 245);
            background-image:
                url("https://images.goway.com/production/styles/article_featured_image_3xl/s3/featured_images/japan_tokyo_akihabara_AdobeStock_295310062_Editorial_Use_Only.jpg.webp?VersionId=3UWga2GUVbrYvlBywbNcJ5lK6UdgwVNd&h=43fc81ba&itok=AWWTIhwv"),
                url("https://www.vacationstravel.com/wp-content/uploads/2025/03/AdobeStock_521002661.jpg");
            background-position: right 24px bottom 24px, left top;
            background-repeat: no-repeat, repeat;
            background-size: 300px auto, 450px auto;
        }

        .content-box {
            max-width: 680px;
            padding: 28px;
            border-radius: 12px;
            background-color: #0f172a;
            background-image:
                linear-gradient(rgba(15, 23, 42, 0.72), rgba(15, 23, 42, 0.72)),
                url("https://handluggageonly.co.uk/wp-content/uploads/2015/09/Hand-Luggage-Only-4-2.jpg");
            background-position: center, center;
            background-repeat: no-repeat, no-repeat;
            background-size: cover, cover;
            color: #ffffff;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        .content-box h1 {
            margin-top: 0;
            margin-bottom: 12px;
        }

        .content-box p {
            margin: 0 0 12px;
            line-height: 1.6;
        }

        .content-box p:last-child {
            margin-bottom: 0;
        }
    </style>
</head>

<body>

    <div id="japan1">
        <div class="content-box">
            <h1>Japan City Images</h1>
            <p>From the neon-lit streets of Tokyo's Akihabara district to historic temple towns, Japan blends
                ultra-modern cityscapes with centuries-old architecture.</p>
            <p>Each region offers a distinct atmosphere, seasonal scenery, and vibrant street life worth exploring.</p>
        </div>
    </div>

</body>

</html>
