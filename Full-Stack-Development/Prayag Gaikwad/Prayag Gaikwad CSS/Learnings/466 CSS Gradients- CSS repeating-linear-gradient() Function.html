<!DOCTYPE html>
<html>

<head>
    <style>
        body{
            background-color: rgb(227, 239, 249);
            text-align: center;
        }
        #grad1 {
            height: 200px;
            background-color: red;
            /* For browsers that do not support gradients */
            background-image: repeating-linear-gradient(red, yellow 10%, green 20%);
        }

        #grad2 {
            height: 200px;
            background-color: rgb(250, 170, 170);
            /* For browsers that do not support gradients */
            background-image: repeating-linear-gradient(45deg, rgb(252, 201, 201), rgb(240, 240, 150) 7%, rgb(145, 243, 145) 10%);
        }

        #grad3 {
            height: 200px;
            background-color: rgb(0, 255, 225);
            /* For browsers that do not support gradients */
            background-image: repeating-linear-gradient(190deg, rgb(0, 106, 255), rgb(255, 0, 221) 7%, rgb(0, 128, 81) 10%);
        }

        #grad4 {
            height: 200px;
            background-color: rgb(162, 255, 0);
            /* For browsers that do not support gradients */
            background-image: repeating-linear-gradient(90deg, rgb(255, 204, 0), rgb(248, 248, 74) 7%, rgb(28, 248, 28) 10%);
        }

        #grad5 {
            height: 200px;
            background-color: rgb(0, 81, 255);
            /* For browsers that do not support gradients */
            background-image: repeating-linear-gradient(45deg, rgb(196, 252, 251) 0px, rgb(253, 173, 173) 10px, rgb(245, 245, 135) 10px, rgb(239, 239, 111) 20px);
        }
    </style>
</head>

<body>

    <h1>Repeating Linear Gradient</h1>

    <div id="grad1"></div>

    <p>A repeating gradient on 45deg axe starting red and finishing green:</p>
    <div id="grad2"></div>

    <p>A repeating gradient on 190deg axe starting red and finishing green:</p>
    <div id="grad3"></div>

    <p>A repeating gradient on 90deg axe starting red and finishing green:</p>
    <div id="grad4"></div>

    <p>A repeating gradient on 45deg axe with solid stripes:</p>
    <div id="grad5"></div>

</body>

</html>
