<!DOCTYPE html>
<html>

<head>
    <style>
        body{
            background-color: lightblue;
        }
        .container {
            display: flex;
            height: 200px;
            align-items: stretch;
            background-color: DodgerBlue;
        }

        .container div {
            background-color: #f1f1f1;
            width: 100px;
            margin: 10px;
            padding: 10px;
            text-align: center;
            font-size: 30px;
        }
    </style>
</head>

<body>

    <h1>align-items: stretch</h1>

    <p>align-items: stretch; stretches the flex items to fill the container:</p>

    <div class="container">
        <div>1</div>
        <div>2</div>
        <div>3</div>
    </div>

</body>

</html>
