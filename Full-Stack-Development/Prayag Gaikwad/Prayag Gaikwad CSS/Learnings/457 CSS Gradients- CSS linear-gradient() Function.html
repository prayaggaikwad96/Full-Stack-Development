<!DOCTYPE html>
<html>

<head>
    <style>
        body{
            background-color: aliceblue;
            text-align: center;
        }
        #grad1 {
            height: 200px;
            background-color: rgb(9, 29, 251);
            /* For browsers that do not support gradients */
            background-image: linear-gradient(to bottom, rgb(182, 201, 251), rgb(160, 255, 252));
        }
    </style>
</head>

<body>

    <h1>Linear Gradient - Top to Bottom</h1>
    <p>This linear gradient starts red at the top, transitioning to yellow at the bottom:</p>

    <div id="grad1"></div>

</body>

</html>
