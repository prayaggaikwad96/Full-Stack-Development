<!DOCTYPE html>
<html>
<head>
<style>
    body{
        background-color: aliceblue;
    }
.container {
  width: 180px;
  height: 180px;
  border: 1px solid lightgray;
  margin: 30px;
  perspective: 600px;
}

.box {
  width: 100%;
  height: 100%;
  background-color: rgb(9, 150, 215);
  transform: rotateY(65deg);
  line-height: 180px;
  text-align: center;
  font-size: 20px;
}
</style>
</head>
<body>

<h1>The rotateY() Function</h1>

<p>The rotateY() function rotates an element around its Y-axis at a given degree.</p>

<div class="container">
  <div class="box">rotateX(65deg)</div>
</div>

</body>
</html>
