<!DOCTYPE html>
<html>

<head>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 60px;
            background-color: rgb(145, 201, 250);
        }

        h1 {
            margin: 0;
            text-align: center;
        }

        .container {
            width: 200px;
            height: 200px;
            perspective: 600px;
        }

        .container:hover .cube {
            animation-play-state: paused;
        }

        .cube {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            animation: spin 5s infinite linear;
        }

        .face {
            position: absolute;
            width: 200px;
            height: 200px;
            border: 2px solid white;
            line-height: 200px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            color: white;
            background: rgba(168, 210, 255, 0.5);
        }

        .front {
            transform: rotateY(0deg) translateZ(100px);
            background-color: rgb(12, 141, 253);
        }

        .back {
            transform: rotateY(180deg) translateZ(100px);
            background-color: rgb(251, 90, 31);
        }

        .left {
            transform: rotateY(-90deg) translateZ(100px);
            background-color: rgb(253, 233, 143);
        }

        .right {
            transform: rotateY(90deg) translateZ(100px);
            background-color: rgb(207, 253, 154);
        }

        .top {
            transform: rotateX(90deg) translateZ(100px);
            background-color: rgb(254, 160, 250);
        }

        .bottom {
            transform: rotateX(-90deg) translateZ(100px);
            background-color: rgb(243, 185, 110);
        }

        @keyframes spin {
            from {
                transform: rotateX(0deg) rotateY(0deg);
            }

            to {
                transform: rotateX(360deg) rotateY(360deg);
            }
        }
    </style>
</head>

<body>

    <h1>CSS 3D Cube</h1>

    <div class="container">
        <div class="cube">
            <div class="face front">front</div>
            <div class="face back">back</div>
            <div class="face right">right</div>
            <div class="face left">left</div>
            <div class="face top">top</div>
            <div class="face bottom">bottom</div>
        </div>
    </div>

</body>

</html>
