<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The transparent Keyword</title>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html {
            -webkit-text-size-adjust: 100%;
        }

        body {
            margin: 0;
            padding: clamp(12px, 3vw, 40px);
            background-color: #f4f4f4;
            background-image: url("https://cdn.mos.cms.futurecdn.net/W5LnBksnN2E3PTCdgDF9g3.png");
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            min-height: 100vh;
            min-height: 100dvh;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
            line-height: 1.5;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 960px;
            margin: 0 auto;
        }

        h2 {
            margin: 0 0 clamp(12px, 2.5vw, 24px);
            font-size: clamp(1.25rem, 2.5vw, 2rem);
            color: #ffffff;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.85);
            overflow-wrap: anywhere;
        }

        .box {
            width: 100%;
            border: 2px solid #000000;
            border-radius: 6px;
            padding: clamp(12px, 2.5vw, 24px);
            font-size: clamp(0.95rem, 1.5vw, 1.125rem);
            overflow-wrap: anywhere;
        }

        #div1 {
            background-color: lightgreen;
            color: #111111;
            margin-bottom: clamp(12px, 2.5vw, 20px);
        }

        #div2 {
            background-color: transparent;
            color: #ffffff;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>

<body>

    <main class="container">
        <h2>The transparent Keyword</h2>

        <div id="div1" class="box">This div has a light green background color.</div>
        <div id="div2" class="box">This div has a transparent background color.</div>
    </main>

</body>

</html>
