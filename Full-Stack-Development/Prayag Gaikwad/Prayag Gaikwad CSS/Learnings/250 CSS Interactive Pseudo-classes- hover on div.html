<!DOCTYPE html>
<html>

<head>
    <style>
        body{
            background-color: rgb(154, 202, 241);
            text-align: center;
        }
        div {
            background-color: rgb(243, 54, 37);
            color: white;
            padding: 25px;
            text-align: center;
        }

        div:hover {
            background-color: blue;
        }
    </style>
</head>

<body>

    <h2>:hover on div</h2>

    <p>Mouse over the div element below to change its background color:</p>

    <div>Mouse Over Me</div>

</body>

</html>
