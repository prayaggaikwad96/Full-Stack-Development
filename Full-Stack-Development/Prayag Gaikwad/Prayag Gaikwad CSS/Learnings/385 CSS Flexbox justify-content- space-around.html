<!DOCTYPE html>
<html>

<head>
    <style>
        body{
            background-color: #f1f1f1;
        }
        .container {
            display: flex;
            justify-content: space-around;
            background-color: DodgerBlue;
        }

        .container div {
            background-color: #f1f1f1;
            width: 100px;
            margin: 10px;
            padding: 10px;
            text-align: center;
            font-size: 30px;
        }
    </style>
</head>

<body>

    <h1>justify-content: space-around</h1>

    <p>justify-content: space-around; displays the flex items with space before, between, and after them:</p>

    <div class="container">
        <div>1</div>
        <div>2</div>
        <div>3</div>
    </div>

</body>

</html>
