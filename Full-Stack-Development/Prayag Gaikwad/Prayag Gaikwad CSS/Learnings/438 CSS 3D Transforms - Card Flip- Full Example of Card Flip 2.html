<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clear CSS 3D Card Flip</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
            font-family: system-ui, -apple-system, sans-serif;
            color: #ffffff;
            background:
              linear-gradient(rgba(15, 23, 42, 0.35), rgba(15, 23, 42, 0.45)),
              url("https://images.hdqwalls.com/wallpapers/japan-city-digital-art-qn.jpg") center / cover no-repeat fixed;
        }

        h1 {
            font-size: 1.75rem;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
        }

        .container {
            width: 280px;
            height: 360px;
            perspective: 1200px;
            cursor: pointer;
        }

        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.8s cubic-bezier(0.22, 1, 0.36, 1);
            transform-style: preserve-3d;
            border-radius: 16px;
            box-shadow: 0 18px 36px rgba(0, 0, 0, 0.35);
            will-change: transform;
        }

        .container:hover .card,
        .container:focus-within .card {
            transform: rotateY(180deg);
        }

        .face {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 18px;
            border: 1px solid rgba(255, 255, 255, 0.35);
            background-color: #111827;
        }

        .face img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            z-index: 0;
        }

        /* Subtle bottom gradient so the image stays clear and text stays readable */
        .face::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(to top,
                    rgba(0, 0, 0, 0.65) 0%,
                    rgba(0, 0, 0, 0.12) 35%,
                    transparent 65%);
            z-index: 1;
            pointer-events: none;
        }

        .face-content {
            position: relative;
            z-index: 2;
            text-shadow: 0 1px 6px rgba(0, 0, 0, 0.75);
        }

        .face h2 {
            font-size: 1.3rem;
            margin-bottom: 2px;
        }

        .face p {
            font-size: 0.875rem;
            color: rgba(255, 255, 255, 0.92);
        }

        .back {
            transform: rotateY(180deg);
        }
    </style>
</head>

<body>

    <h1>CSS Card Flip</h1>

    <div class="container" tabindex="0">
        <div class="card">
            <div class="face front">
                <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1000&q=85"
                    alt="Mountain ridge at dusk" />
                <div class="face-content">
                    <h2>Front</h2>
                    <p>Hover to flip</p>
                </div>
            </div>

            <div class="face back">
                <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1000&q=85"
                    alt="Ocean waves on a sandy shore" />
                <div class="face-content">
                    <h2>Back</h2>
                    <p>Coastal view</p>
                </div>
            </div>
        </div>
    </div>

</body>

</html>
