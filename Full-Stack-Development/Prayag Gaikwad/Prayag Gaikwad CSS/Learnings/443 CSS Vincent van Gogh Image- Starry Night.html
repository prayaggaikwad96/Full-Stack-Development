    <!DOCTYPE html>
    <html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Vincent van Gogh — Legendary Painter</title>
        <style>
            html {
                scroll-behavior: smooth;
            }

            body {
                background-color: rgb(115, 165, 213);
                margin: 0;
                font-family: Arial, Helvetica, sans-serif;
                color: #222222;
            }

            .hero-image {
                background: url("https://pixelz.cc/wp-content/uploads/2018/07/vincent-van-gogh-self-portrait-painting-uhd-4k-wallpaper.jpg") no-repeat center;
                background-size: cover;
                height: 500px;
                position: relative;
            }

            .hero-text {
                text-align: center;
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                color: white;
            }

            .hero-btn {
                display: inline-block;
                margin-top: 12px;
                padding: 10px 22px;
                background-color: #ffffff;
                color: #111111;
                text-decoration: none;
                font-weight: bold;
                border-radius: 4px;
            }

            .hero-btn:hover {
                background-color: #faeeee;
            }

            .content-box {
                max-width: 800px;
                margin: 30px auto;
                padding: 24px;
                background-color: #f5e9e9;
                background-image: url(https://media.newyorker.com/photos/647a15fec91efd6c449e2964/1:1/w_2030,h_2030,c_limit/Arn-Van-Gogh-Secondary-1.jpg);
                border-radius: 8px;
                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            }

            .contact-form {
                display: flex;
                flex-direction: column;
                gap: 14px;
                margin-top: 18px;
            }

            .contact-form label {
                font-weight: bold;
                font-size: 14px;
                margin-bottom: 4px;
                display: block;
            }

            .contact-form input,
            .contact-form select,
            .contact-form textarea {
                width: 100%;
                padding: 10px 12px;
                border: 1px solid #cccccc;
                border-radius: 4px;
                font-family: inherit;
                font-size: 14px;
                box-sizing: border-box;
            }

            .contact-form textarea {
                resize: vertical;
                min-height: 110px;
            }

            .submit-btn {
                align-self: flex-start;
                padding: 10px 24px;
                background-color: #521f1f;
                color: #ffffff;
                border: none;
                border-radius: 4px;
                font-size: 15px;
                font-weight: bold;
                cursor: pointer;
            }

            .submit-btn:hover {
                background-color: #162b3d;
            }
        </style>
    </head>

    <body>

        <div class="hero-image">
            <div class="hero-text">
                <h1 style="font-size: 50px; margin: 0;">I am Vincent van Gogh</h1>
                <h3>And I'm a Dutch Post-Impressionist painter</h3>
                <a class="hero-btn" href="https://en.wikipedia.org/wiki/Vincent_van_Gogh">Hire me</a>
            </div>
        </div>

        <div id="contact" class="content-box">
            <h2>About &amp; Commissions</h2>
            <p>Available for portrait commissions, expressive landscapes, and gallery exhibitions.</p>
            <p>The hero banner uses <code>background-size: cover</code> so it stays responsive—resize the browser window to
                see how it adapts.</p>

            <form class="contact-form" action="#" method="post">
                <div>
                    <label for="name">Your Name</label>
                    <input type="text" id="name" name="name" placeholder="Vincent van Gogh" required>
                </div>

                <div>
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="VVG@example.com" required>
                </div>

                <div>
                    <label for="commission-type">Commission Type</label>
                    <select id="commission-type" name="commission_type">
                        <option value="portrait">Oil Portrait</option>
                        <option value="landscape">Landscape Painting</option>
                        <option value="still-life">Still Life</option>
                        <option value="exhibition">Gallery Exhibition Inquiry</option>
                    </select>
                </div>

                <div>
                    <label for="details">Project Details</label>
                    <textarea id="details" name="details"
                        placeholder="Describe canvas size, subject, and preferred timeline..." required></textarea>
                </div>

                <button type="submit" class="submit-btn">Send Inquiry</button>
            </form>
        </div>

    </body>

    </html>
