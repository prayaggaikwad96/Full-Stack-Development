<!DOCTYPE html>
<html>

<head>
    <style>
        body{
            background-color: rgb(140, 204, 231);
            text-align: center;
            
        }
        p::first-letter {
            color: #ff0000;
            font-size: xx-large;
        }
    </style>
</head>

<body>

    <h2>Using ::first-letter</h2>

    <p>You can use the ::first-letter pseudo-element to add a special effect to the first character of a text!</p>

</body>

</html>
