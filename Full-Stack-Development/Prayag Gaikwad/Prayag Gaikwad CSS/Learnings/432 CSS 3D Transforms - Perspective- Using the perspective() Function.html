<!DOCTYPE html>
<html>
<head>
<style>
    body{
        background-color: lightsteelblue;
        text-align: center;
    }
.container {
  width: 180px;
  height: 180px;
  border: 1px solid lightgray;
  margin: 30px;
}

.box {
  width: 100%;
  height: 100%;
  background-color: rgb(84, 184, 251);
  transform: perspective(500px) rotateY(45deg);
}
</style>
</head>
<body>

<h1>The perspective() function</h1>

<div class="container">
  <div class="box">The Perspective Property at 45 Deg</div>
</div>

</body>
</html>
