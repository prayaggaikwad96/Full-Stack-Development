<!DOCTYPE html>
<html>

<head>
    <style>
        body{
            background-color: aliceblue;
            text-align: center;
        }
        .container {
            width: 180px;
            height: 180px;
            border: 1px solid lightgray;
            margin: 30px;
            perspective: 500px;
        }

        .box {
            width: 100%;
            height: 100%;
            background-color: rgb(37, 128, 177);
            transform: rotateY(65deg);
        }
    </style>
</head>

<body>

    <h1>The Perspective Property</h1>

    <div class="container">
        <div class="box"></div>
    </div>

</body>

</html>
