<!DOCTYPE html>
<html>

<head>
    <style>
        body {
            background-color: blanchedalmond;
        }

        table,
        td,
        th {
            border: 1px solid;
            padding: 8px 12px;
            /* Added some padding for better readability */
        }

        table {
            border-collapse: collapse;
            background-color: white;
            /* Optional: gives the table a clean background */
        }
    </style>
</head>

<body>

    <h2>Let the table borders collapse</h2>

    <table>
        <tr>
            <th>Firstname</th>
            <th>Lastname</th>
        </tr>
        <tr>
            <td>Peter</td>
            <td>Griffin</td>
        </tr>
        <tr>
            <td>Lois</td>
            <td>Griffin</td>
        </tr>
    </table>

</body>

</html>
