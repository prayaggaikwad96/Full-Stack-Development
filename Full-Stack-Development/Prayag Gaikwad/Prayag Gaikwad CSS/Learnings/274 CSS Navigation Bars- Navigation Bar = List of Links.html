<!DOCTYPE html>
<html>

<head>
    <title>Basic HTML Navbar</title>

    <style>
        body {
            background-color: rgb(164, 209, 238);
            text-align: center;
            font-family: Arial, sans-serif;
        }

        ul {
            list-style-type: none;
            margin: 0;
            padding: 0;
            background-color: #333;
            display: flex;
            justify-content: center;
        }

        li a {
            display: block;
            color: white;
            padding: 14px 20px;
            text-decoration: none;
        }

        li a:hover {
            background-color: rgb(253, 105, 95);
            color: white;
        }
    </style>
</head>

<body>

    <h2>Basic HTML Code for Navbar</h2>

    <ul>
        <li><a href="#home">Home</a></li>
        <li><a href="#news">News</a></li>
        <li><a href="#contact">Contact</a></li>
        <li><a href="#about">About</a></li>
    </ul>

    <p>Note: These links navigate to matching IDs on this page.</p>

</body>

</html>
