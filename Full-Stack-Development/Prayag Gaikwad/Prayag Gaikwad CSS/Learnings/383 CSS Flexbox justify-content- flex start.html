<!DOCTYPE html>
<html>

<head>
    <style>
        .container {
            display: flex;
            justify-content: flex-start;
            background-color: DodgerBlue;
        }

        .container div {
            background-color: #f1f1f1;
            width: 100px;
            margin: 10px;
            padding: 10px;
            text-align: center;
            font-size: 30px;
        }
    </style>
</head>

<body>

    <h1>justify-content: flex-start</h1>

    <p>justify-content: flex-start; aligns the flex items at the beginning of the container (this is default):</p>

    <div class="container">
        <div>1</div>
        <div>2</div>
        <div>3</div>
    </div>

</body>

</html>
