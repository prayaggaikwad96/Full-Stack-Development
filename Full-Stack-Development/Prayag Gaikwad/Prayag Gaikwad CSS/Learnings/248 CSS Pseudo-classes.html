<!DOCTYPE html>
<html>

<head>
    <title>CSS Pseudo-Class</title>
    <style>
        body{
            background-color: antiquewhite;
            text-align: center;
        }
        button {
            background-color: blue;
            color: white;
            padding: 10px;
            border: none;
        }

        button:hover {
            background-color: red;
        }
    </style>
</head>

<body>
    <h2>CSS Pseudo-Class Example</h2>
    <button>Move Mouse Here</button>
</body>

</html>
