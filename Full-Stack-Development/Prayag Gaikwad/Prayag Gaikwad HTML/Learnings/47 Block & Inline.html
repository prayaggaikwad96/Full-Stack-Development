```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Block & Inline Elements</title>
</head>

<body style="background-color: powderblue;">

    <div style="text-align: center;">

        <h1>Block & Inline Elements</h1>

        <!-- Block Element -->
        <p style="border: 1px solid black; font-weight: bold;">
            Hello World
        </p>

        <!-- Block Element -->
        <div style="border: 1px solid black; font-weight: bold;">
            Hello World
        </div>

        <p>
            The <strong>&lt;p&gt;</strong> and <strong>&lt;div&gt;</strong>
            elements are both block-level elements.
            They normally start on a new line and take up the full width available.
        </p>

        <!-- Inline Element -->
        <p>
            This is an
            <span style="border: 1px solid black; font-weight: bold;">
                inline element
            </span>
            inside a paragraph.
        </p>

    </div>

</body>

</html>
```
