<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation Bar Example</title>
    <style>
        /* Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Page */
        body {
            background-color: rgb(235, 207, 169);
            font-family: Arial, sans-serif;
        }

        /* Navigation bar */
        .navbar {
            width: 100%;
            height: 60px;
            background-color: #333;

            display: flex;
            justify-content: space-between;
            align-items: center;

            padding: 0 20px;
            position: relative;
        }

        /* Logo */
        .nav-logo {
            z-index: 2;
            /* Keeps logo clickable and on top */
        }

        .nav-logo a {
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-decoration: none;
        }

        /* Container for center alignment */
        .nav-center-wrapper {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            height: 100%;
        }

        /* Links container */
        .nav-links {
            display: flex;
            list-style: none;
            height: 100%;
        }

        /* Each link */
        .nav-links li {
            height: 100%;
        }

        .nav-links a {
            display: flex;
            align-items: center;
            height: 100%;
            padding: 0 15px;

            color: white;
            text-decoration: none;

            transition: background-color 0.3s, color 0.3s;
        }

        /* Hover */
        .nav-links a:hover {
            background-color: black;
            color: rgb(251, 241, 98);
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <div class="nav-logo">
            <a href="#">Logo</a>
        </div>

        <!-- Center-aligned section containing your navigation lists -->
        <div class="nav-center-wrapper">
            <!-- First navigation list -->
            <ul class="nav-links">
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Services</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </div>
    </nav>

</body>

</html>
