<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KBD Element</title>

    <style>
        body {
            background: linear-gradient(145deg, #9bc8f6, #bccfdb, #026a89);
            min-height: 100vh;
            margin: 10;
            padding: 20px;
            spacing:10px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        
        h2 {
            color: black;
        }

        p {
            color:#333;
            font-size: 18px;
        }

        kbd {
            background-color: #333;
            color:whitesmoke;
            padding: 5px 10px;
            border-radius: 4px;
            font-family: monospace;
        }
    </style>
</head>

<body>

    <h2>The &lt;kbd&gt; Element</h2>

    <p>
        The <kbd>kbd</kbd> element is used to define keyboard input.
    </p>

    <p>
        Example: Press <kbd>Ctrl</kbd> + <kbd>C</kbd> to copy.
    </p>

</body>

</html>
