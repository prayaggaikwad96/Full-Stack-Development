<!DOCTYPE html>
<html>

<head>
    <style>
        table {
            border-collapse: collapse;
            width: 100%;
        }

        th,
        td {
            text-align: left;
            padding: 10px;
        }

        tr:nth-child(even) {
            background-color: blanchedalmond;
        }
    </style>
</head>

<body>

    <h2>Zebra Striped Table</h2>
    <p>For zebra-striped tables, use the nth-child() selector and add a background-color to all even (or odd) table
        rows:</p>

    <table>
        <tr>
            <th>First Name</th>
            <th>Last Name</th>
            <th>Points</th>
        </tr>
        <tr>
            <td>Peter</td>
            <td>Griffin</td>
            <td>$200</td>
        </tr>
        <tr>
            <td>Lois</td>
            <td>Griffin</td>
            <td>$300</td>
        </tr>
        <tr>
            <td>Joe</td>
            <td>Swanson</td>
            <td>$400</td>
        </tr>
        <tr>
            <td>Cleveland</td>
            <td>Brown</td>
            <td>$500</td>
        </tr>
    </table>

</body>

</html>
