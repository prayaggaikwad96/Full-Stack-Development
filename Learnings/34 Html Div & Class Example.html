<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HTML DIV Example</title>

    <style>
        body {
            background-color: beige;
            padding: 20px;
            text-align: center;
        }

        div {
            background-color: yellow;
            padding: 20px;
            margin: 20px;
        }

        h1 {
            background-color: plum;
            color: black;
            padding: 15px;
            margin-bottom: 25px;
        }

        .London {
            background-color: blue;
            color: black;
            padding: 10px;
            margin: 15px 0 5px 0;
        }

        .New-York {
            background-color: turquoise;
            color: black;
            padding: 10px;
            margin: 25px 0 5px 0;
        }

        .Amsterdam {
            background-color: red;
            color: black;
            padding: 10px;
            margin: 25px 0 5px 0;
        }

        .Texas {
            background-color: greenyellow;
            color: black;
            padding: 10px;
            margin: 25px 0 5px 0;
        }

        .town {
            background-color: bisque;
            color: black;
            padding: 10px;
            margin: 5px 0 20px 0;
        }

        .city {
            background-color: goldenrod;
            color: black;
            padding: 10px;
            margin: 5px 0 20px 0;
        }

        .village {
            background-color: thistle;
            color: black;
            padding: 10px;
            margin: 5px 0 20px 0;
        }

        .home {
            background-color: orange;
            color: black;
            padding: 10px;
            margin: 5px 0 20px 0;
        }

        a {
            color: black;
        }
    </style>
</head>

<body>

    <h1>HTML DIV Example</h1>

    <div>

        <h2 class="London">
            <a href="https://www.google.com/search?q=London" target="_blank">
                London
            </a>
        </h2>

        <p class="town">
            London is the capital city of England.
        </p>

        <h2 class="New-York">
            <a href="https://www.google.com/search?q=New+York" target="_blank">
                New York
            </a>
        </h2>

        <p class="city">
            New York has over 9 million inhabitants.
        </p>

    </div>

    <h2 class="Amsterdam">
        <a href="https://www.google.com/search?q=Amsterdam" target="_blank">
            Amsterdam
        </a>
    </h2>

    <p class="village">
        The yellow background is added to demonstrate the footprint of the DIV element.
    </p>

    <h2 class="Texas">
        <a href="https://www.google.com/search?q=Texas" target="_blank">
            Texas
        </a>
    </h2>

    <p class="home">
        The yellow background is added to demonstrate the footprint of the DIV element.
    </p>

</body>

</html>
