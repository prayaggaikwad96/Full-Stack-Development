<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple HTML Table</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse ;
            font-family: Arial, sans-serif;
        }

        th,td {
            border: 2px solid black;
            padding: 10px;
            text-align: left;
        }

        th {
            background-color: white;
        }
    </style>
</head>

<body>
    

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Role</th>
                <th>Salary</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1</td>
                <td> Prayag Gaikwad</td>
                <td> Developer </td>
                <td> 900000</td>
            </tr>
            <tr>
                <td>2</td>
                <td>Alice Smith</td>
                <td>Developer</td>
                <td> 70000</td>
            </tr>
            <tr>
                <td>3</td>
                <td>Bob Jones</td>
                <td>Designer</td>
                <td> 50000</td>
            </tr>
            <tr>
                <td>4</td>
                <td>Charlie Brown</td>
                <td>Manager</td>
                <td> 20000</td>
            </tr>
            <tr>
                <td>5</td>
                <td>David Miller</td>
                <td>Developer</td>
                <td>85000</td>
            </tr>
            <tr>
                <td>6</td>
                <td>Emma Watson</td>
                <td>Designer</td>
                <td>65000</td>
            </tr>
            <tr>
                <td>7</td>
                <td>Frank Castle</td>
                <td>Manager</td>
                <td>95000</td>
            </tr>
            <tr>
                <td>8</td>
                <td>Grace Hopper</td>
                <td>Developer</td>
                <td>120000</td>
            </tr>
            
        </tbody>
    </table>

</body>

</html>
