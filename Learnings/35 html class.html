<!DOCTYPE html>
<html>

<head>
    <style>

        .city {
            background-color: orchid;
            color: black;
            border: 2px solid black;
            margin: 20px;
            padding: 20px;
        }

        .town {
            background-color: olivedrab;
            color: black;
            border: 2px solid black;
            margin: 20px;
            padding: 20px;
        }

        .village {
            background-color: orangered;
            color: black;
            border: 2px solid black;
            margin: 20px;
            padding: 20px;
        }

    </style>
</head>


<body style="background-color: beige;"

<b> <center>

    <div class="city">
        <h2>London</h2>
        <p>London is the capital of England.</p>
    </div>

    <div class="town">
        <h2>Paris</h2>
        <p>Paris is the capital of France.</p>
    </div>

    <div class="village">
        <h2>Tokyo</h2>
        <p>Tokyo is the capital of Japan.</p>
    </div>

</b> </center> 

</body>

</html>
